<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ศูนย์พัฒนาเด็กเล็กเทศบาลเมืองทับกวาง (ป่าไผ่)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: none; width: 100%; max-width: 400px; overflow: hidden; }
        .login-header { background: #343a40; color: white; padding: 30px 20px; text-align: center; }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="card login-card">
        <div class="login-header">
            <i class="fas fa-school fa-3x mb-3 text-warning"></i>
            <h4>ระบบจัดการข้อมูล</h4>
            <p class="mb-0 text-light">ศูนย์พัฒนาเด็กเล็กเทศบาลเมืองทับกวาง (ป่าไผ่)</p>
        </div>
        <div class="card-body p-4">
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold"><i class="fas fa-user"></i> ชื่อผู้ใช้งาน (Username)</label>
                    <input type="text" id="username" class="form-control form-control-lg" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted fw-bold"><i class="fas fa-lock"></i> รหัสผ่าน (Password)</label>
                    <input type="password" id="password" class="form-control form-control-lg" required>
                </div>
                
                <div id="errorMsg" class="alert alert-danger d-none py-2 text-center"><small><i class="fas fa-exclamation-circle"></i> ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง!</small></div>
                
                <button type="submit" id="loginBtn" class="btn btn-primary btn-lg w-100 fw-bold">เข้าสู่ระบบ</button>
            </form>
        </div>
    </div>
</div>

<script>
    // ⚠️ ใส่ URL Web App อันล่าสุดของคุณตรงนี้ ⚠️
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwSVGbndnWyuC9huJtu-1_VK1vFa0hzneDxbMVAjD_c61EMl84wk8Rl_rsU8C86sEci/exec';

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const btn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');

        // เปลี่ยนหน้าตาปุ่มตอนกำลังโหลด
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังตรวจสอบ...';
        btn.disabled = true;
        errorMsg.classList.add('d-none');

        // สร้าง URL สำหรับเช็ค Login
        const loginURL = `${scriptURL}?action=login&username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`;

        // ยิงข้อมูลไปถาม Google Apps Script
        fetch(loginURL)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') { // ⚠️ ต้องแก้บรรทัดนี้ครับ
                    // ถ้ารหัสถูก บันทึกสถานะแล้วไปหน้า Dashboard
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('userName', data.name);
                    sessionStorage.setItem('userRole', data.role);
                    
                    window.location.href = 'dashboard.html'; 
                } else {
                    // ถ้ารหัสผิด แสดงข้อความเตือน
                    errorMsg.classList.remove('d-none');
                    btn.innerHTML = 'เข้าสู่ระบบ';
                    btn.disabled = false;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์');
                btn.innerHTML = 'เข้าสู่ระบบ';
                btn.disabled = false;
            });
    });
</script>
</body>
</html>
