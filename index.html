<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกข้อมูล - ศพด.ทับกวาง (ป่าไผ่)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; padding-top: 20px; }
        .main-card { border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: none; }
        .header-banner { background: #007bff; color: white; padding: 30px; text-align: center; border-radius: 20px 20px 0 0; }
        .section-title { background: #f8f9fa; border-left: 5px solid #007bff; padding: 10px; margin: 25px 0 15px 0; font-weight: 600; }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">
    <div class="spinner-border text-primary"></div>
    <h5 class="ms-3">กำลังบันทึกข้อมูล...</h5>
</div>

<div class="container mb-5">
    <div class="card main-card">
        <div class="header-banner">
            <i class="fas fa-school fa-2x mb-2"></i>
            <h2>ศพด.เทศบาลเมืองทับกวาง (ป่าไผ่)</h2>
            <p>บันทึกข้อมูลนักเรียน (ระบบฟรีผ่าน GitHub & Google Sheets)</p>
        </div>
        <div class="card-body p-4">
            <form id="childForm">
                <div class="section-title">1. ข้อมูลพื้นฐาน</div>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">ระดับชั้น</label>
                        <select name="classLevel" class="form-select" required>
                            <option value="">-- เลือก --</option>
                            <option>เตรียมอนุบาล</option>
                            <option>อนุบาล ๑</option>
                            <option>อนุบาล ๒/๑</option>
                            <option>อนุบาล ๒/๒</option>
                            <option>อนุบาล ๓</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">รหัสประจำตัว</label>
                        <input type="text" name="studentId" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">ชื่อ-นามสกุล</label>
                        <input type="text" name="fullName" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">ชื่อเล่น</label>
                        <input type="text" name="nickName" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">วันเกิด</label>
                        <input type="date" name="birthDate" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">เพศ</label>
                        <select name="gender" class="form-select"><option>ชาย</option><option>หญิง</option></select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">กรุ๊ปเลือด</label>
                        <select name="bloodType" class="form-select"><option>-</option><option>A</option><option>B</option><option>AB</option><option>O</option></select>
                    </div>
                </div>

                <div class="section-title">2. ข้อมูลที่อยู่</div>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">จังหวัด</label>
                        <select id="province" name="province" class="form-select" required onchange="updateAmphoe()"></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">อำเภอ/เขต</label>
                        <select id="amphoe" name="amphoe" class="form-select" required onchange="updateTambon()"></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">ตำบล/แขวง</label>
                        <select id="tambon" name="tambon" class="form-select" required></select>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">รายละเอียด (บ้านเลขที่/หมู่/ซอย)</label>
                        <input type="text" name="addressDetail" class="form-control">
                    </div>
                </div>

                <div class="section-title">3. ติดต่อฉุกเฉิน</div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">ชื่อผู้ปกครอง</label>
                        <input type="text" name="parentName" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">เบอร์โทรศัพท์</label>
                        <input type="tel" name="emergencyTel" class="form-control" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-success w-100 mt-5 p-3 fw-bold">
                    <i class="fas fa-save"></i> บันทึกข้อมูล
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    const scriptURL = 'ใส่_URL_ที่ได้จาก_Google_Apps_Script_ของคุณตรงนี้';
    let addressData = [];

    // โหลดข้อมูลจังหวัด
    fetch('https://raw.githubusercontent.com/kongvut/thai-province-data/master/api/latest/province_with_district_and_sub_district.json')
        .then(res => res.json())
        .then(data => {
            addressData = data;
            const provSelect = document.getElementById('province');
            provSelect.innerHTML = '<option value="">-- เลือกจังหวัด --</option>';
            data.sort((a,b) => a.name_th.localeCompare(b.name_th, 'th'))
                .forEach(p => provSelect.add(new Option(p.name_th, p.name_th)));
        });

    function updateAmphoe() {
        const provName = document.getElementById('province').value;
        const ampSelect = document.getElementById('amphoe');
        const tamSelect = document.getElementById('tambon');
        
        ampSelect.innerHTML = '<option value="">-- เลือกอำเภอ --</option>';
        tamSelect.innerHTML = '<option value="">-- เลือกตำบล --</option>';
        
        const prov = addressData.find(p => p.name_th === provName);
        if (prov) {
            // เพิ่มการรองรับ Key 'districts' เพื่อให้ตรงกับ API เวอร์ชันใหม่
            const districts = prov.districts || prov.district || prov.amphures || prov.amphure || [];
            districts.sort((a,b) => a.name_th.localeCompare(b.name_th, 'th'))
                .forEach(d => ampSelect.add(new Option(d.name_th, d.name_th)));
        }
    }

    function updateTambon() {
        const provName = document.getElementById('province').value;
        const ampName = document.getElementById('amphoe').value;
        const tamSelect = document.getElementById('tambon');
        tamSelect.innerHTML = '<option value="">-- เลือกตำบล --</option>';
        
        const prov = addressData.find(p => p.name_th === provName);
        // เพิ่มการรองรับ Key ดึงข้อมูลอำเภอ
        const districts = prov?.districts || prov?.district || prov?.amphures || prov?.amphure || [];
        const amp = districts.find(d => d.name_th === ampName);
        
        if (amp) {
            // เพิ่มการรองรับ Key 'sub_districts' เพื่อให้ตรงกับ API เวอร์ชันใหม่
            const tambons = amp.sub_districts || amp.sub_district || amp.tambons || amp.tambon || [];
            tambons.sort((a,b) => a.name_th.localeCompare(b.name_th, 'th'))
                .forEach(t => tamSelect.add(new Option(t.name_th, t.name_th)));
        }
    }

    const form = document.getElementById('childForm');
    form.addEventListener('submit', e => {
        e.preventDefault();
        document.getElementById('loadingOverlay').style.display = 'flex';
        fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(Object.fromEntries(new FormData(form).entries()))})
        .then(() => {
            document.getElementById('loadingOverlay').style.display = 'none';
            alert('บันทึกสำเร็จ!');
            form.reset();
        })
        .catch(() => {
            document.getElementById('loadingOverlay').style.display = 'none';
            alert('เกิดข้อผิดพลาด!');
        });
    });
</script>
</body>
</html>
