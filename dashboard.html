<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - ข้อมูลนักเรียน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8f9fa; }
        .sidebar { height: 100vh; background: #343a40; color: white; padding-top: 20px; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 10px 20px; display: block; }
        .sidebar a:hover { color: white; background: #495057; }
    </style>
</head>
<body>
    <!-- Check Login Status -->
    <script>
        if(!localStorage.getItem('user')) { window.location.href = 'index.html'; }
    </script>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <h4 class="text-center mb-4">ศูนย์พัฒนาเด็กเล็ก<br>ทับกวาง (ป่าไผ่)</h4>
                <a href="dashboard.html" class="text-white fw-bold">📊 Dashboard</a>
                <a href="regdata.html">📝 เพิ่ม/แก้ไขข้อมูลนักเรียน</a>
                <a href="#" onclick="logout()" class="text-danger mt-5">🚪 ออกจากระบบ</a>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Dashboard สรุปข้อมูลนักเรียน</h2>
                    <span id="userNameDisplay" class="badge bg-primary fs-6"></span>
                </div>

                <!-- Charts Row -->
                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="card shadow-sm"><div class="card-body">
                            <h5 class="card-title">สัดส่วน ชาย-หญิง</h5>
                            <canvas id="genderChart" height="200"></canvas>
                        </div></div>
                    </div>
                    <div class="col-md-6">
                        <div class="card shadow-sm"><div class="card-body">
                            <h5 class="card-title">จำนวนนักเรียนแยกตามชั้น</h5>
                            <canvas id="classChart" height="200"></canvas>
                        </div></div>
                    </div>
                </div>

                <!-- Data Table -->
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">รายชื่อนักเรียนทั้งหมด</h5>
                        <div class="table-responsive">
                            <table id="studentTable" class="table table-striped w-100">
                                <thead>
                                    <tr>
                                        <th>รหัสนักเรียน</th>
                                        <th>ชื่อ-สกุล</th>
                                        <th>ชื่อเล่น</th>
                                        <th>เพศ</th>
                                        <th>ชั้นเรียน</th>
                                        <th>ห้อง</th>
                                    </tr>
                                </thead>
                                <tbody><!-- Data will be loaded here --></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxdPp4BId7QeUlfe8_Kq6ZWKycu4dPSIeMLJYK84zgM_aiLafIUqNsWyp88mKuQ4SvG/exec'; // <<--- เปลี่ยนตรงนี้

        // แสดงชื่อผู้ใช้
        const user = JSON.parse(localStorage.getItem('user'));
        document.getElementById('userNameDisplay').innerText = `ผู้ใช้งาน: ${user.name}`;

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        // ดึงข้อมูลนักเรียน
        fetch(API_URL + '?action=getStudents')
            .then(res => res.json())
            .then(data => {
                // 1. นำข้อมูลใส่ตาราง DataTables
                $('#studentTable').DataTable({
                    data: data,
                    columns: [
                        { data: 'StudentId' },
                        { data: 'FullName' },
                        { data: 'NickName' },
                        { data: 'Gender' },
                        { data: 'ClassLevel' },
                        { data: 'Room' }
                    ],
                    language: { url: '//cdn.datatables.net/plug-ins/1.13.4/i18n/th.json' }
                });

                // 2. คำนวณข้อมูลสำหรับกราฟ ชาย-หญิง
                let male = data.filter(s => s.Gender === 'ชาย').length;
                let female = data.filter(s => s.Gender === 'หญิง').length;
                new Chart(document.getElementById('genderChart'), {
                    type: 'pie',
                    data: {
                        labels: ['ชาย', 'หญิง'],
                        datasets: [{ data: [male, female], backgroundColor: ['#36a2eb', '#ff6384'] }]
                    }
                });

                // 3. คำนวณข้อมูลสำหรับกราฟ ชั้นเรียน
                let classCounts = {};
                data.forEach(s => {
                    classCounts[s.ClassLevel] = (classCounts[s.ClassLevel] || 0) + 1;
                });
                new Chart(document.getElementById('classChart'), {
                    type: 'bar',
                    data: {
                        labels: Object.keys(classCounts),
                        datasets: [{ label: 'จำนวนนักเรียน', data: Object.values(classCounts), backgroundColor: '#4bc0c0' }]
                    }
                });
            });
    </script>
</body>
</html>
