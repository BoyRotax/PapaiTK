<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ศูนย์พัฒนาเด็กเล็กเทศบาลเมืองทับกวาง (ป่าไผ่)</title>
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; }
        .sidebar { background: #343a40; color: white; min-height: 100vh; padding-top: 20px; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; font-weight: 600; }
        .sidebar a:hover, .sidebar a.active { color: white; background: #495057; border-left: 4px solid #f39c12; }
        .card-stat { border-radius: 15px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<!-- เช็คสถานะ Login ก่อนเลย (ถ้ายังไม่ Login ให้เด้งกลับไป index.html) -->
<script>
    if (sessionStorage.getItem('isLoggedIn') !== 'true') {
        window.location.href = 'index.html';
    }
</script>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar d-none d-md-block">
            <div class="text-center mb-4">
                <i class="fas fa-school fa-3x text-warning mb-2"></i>
                <h6 class="text-light">ศพด. ทับกวาง (ป่าไผ่)</h6>
            </div>
            <a href="dashboard.html" class="active"><i class="fas fa-chart-pie me-2"></i> แดชบอร์ด</a>
            <a href="#"><i class="fas fa-user-graduate me-2"></i> ข้อมูลนักเรียน</a>
            <a href="#"><i class="fas fa-chalkboard-teacher me-2"></i> ข้อมูลครู</a>
            <hr class="text-secondary">
            <a href="#" onclick="logout()" class="text-danger"><i class="fas fa-sign-out-alt me-2"></i> ออกจากระบบ</a>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold"><i class="fas fa-chart-pie"></i> แดชบอร์ดสรุปข้อมูล</h3>
                <div class="badge bg-primary fs-6 p-2 rounded-pill">
                    <i class="fas fa-user me-1"></i> <span id="displayUserName">กำลังโหลด...</span>
                </div>
            </div>

            <!-- กล่องสรุปตัวเลข -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card card-stat bg-primary text-white p-3">
                        <h5>นักเรียนทั้งหมด</h5>
                        <h2 id="totalStudents">0</h2>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-stat bg-info text-white p-3">
                        <h5>นักเรียนชาย</h5>
                        <h2 id="totalMale">0</h2>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-stat bg-danger text-white p-3">
                        <h5>นักเรียนหญิง</h5>
                        <h2 id="totalFemale">0</h2>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-stat bg-success text-white p-3">
                        <h5>จำนวนครู</h5>
                        <h2 id="totalTeachers">0</h2>
                    </div>
                </div>
            </div>

            <!-- ตารางข้อมูล -->
            <div class="card card-stat p-4">
                <h5 class="mb-3 fw-bold"><i class="fas fa-list"></i> รายชื่อนักเรียน</h5>
                <div class="table-responsive">
                    <table id="studentTable" class="table table-hover w-100">
                        <thead class="table-light">
                            <tr>
                                <th>รหัส</th>
                                <th>ชื่อ-สกุล</th>
                                <th>ชื่อเล่น</th>
                                <th>ชั้นเรียน</th>
                                <th>ห้อง</th>
                                <th>เพศ</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- ข้อมูลจะถูกเติมด้วย JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

<script>
    // ⚠️ นำ Web App URL ของคุณมาใส่ตรงนี้ (อันเดียวกับหน้า Login) ⚠️
    const scriptURL = 'https://script.google.com/macros/s/AKfycbypUi0mbHAcLtoSOCOx_oVNnzyRX7N1vBnpPu3yGpVTUxgRNuV0u1YXzfvWHzywGgYgyg/exec'; 

    // แสดงชื่อผู้ใช้ที่ Login เข้ามา
    document.getElementById('displayUserName').innerText = sessionStorage.getItem('userName') || 'ผู้ดูแลระบบ';

    function logout() {
        sessionStorage.clear();
        window.location.href = 'index.html';
    }

    // ฟังก์ชันดึงข้อมูลมาแสดงในหน้า Dashboard
    function loadDashboardData() {
        // 1. ดึงข้อมูลนักเรียน
        fetch(scriptURL + '?action=getStudents')
            .then(res => res.json())
            .then(data => {
                document.getElementById('totalStudents').innerText = data.length;
                document.getElementById('totalMale').innerText = data.filter(s => s.Gender === 'ชาย').length;
                document.getElementById('totalFemale').innerText = data.filter(s => s.Gender === 'หญิง').length;

                // ใส่ข้อมูลลง DataTable
                $('#studentTable').DataTable({
                    data: data,
                    columns: [
                        { data: 'StudentId' },
                        { data: 'FullName' },
                        { data: 'NickName' },
                        { data: 'ClassLevel' },
                        { data: 'Room' },
                        { data: 'Gender' }
                    ],
                    language: { url: '//cdn.datatables.net/plug-ins/1.13.4/i18n/th.json' }
                });
            })
            .catch(err => console.error("โหลดข้อมูลนักเรียนไม่สำเร็จ:", err));

        // 2. ดึงข้อมูลครู (เพื่อหาจำนวนรวม)
        fetch(scriptURL + '?action=getTeachers')
            .then(res => res.json())
            .then(data => {
                document.getElementById('totalTeachers').innerText = data.length;
            })
            .catch(err => console.error("โหลดข้อมูลครูไม่สำเร็จ:", err));
    }

    // เรียกใช้งานเมื่อเปิดหน้าเว็บ
    $(document).ready(function() {
        loadDashboardData();
    });
</script>
</body>
</html>
