<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการข้อมูล - ศพด.ทับกวาง (ป่าไผ่)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; }
        #mainContent { display: none; padding: 20px 0; }
        .login-container { height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-card, .main-card { border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: none; background: white; }
        .header-banner { background: linear-gradient(135deg, #007bff, #00c6ff); color: white; padding: 30px; text-align: center; border-radius: 20px 20px 0 0; }
        .section-title { background: #e9ecef; border-left: 5px solid #007bff; padding: 10px; margin: 25px 0 15px 0; font-weight: 600; display: flex; justify-content: space-between; }
        .edit-badge { background: #ffc107; color: #000; padding: 2px 10px; border-radius: 15px; font-size: 0.8rem; display: none; }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">
    <div class="spinner-border text-primary"></div>
    <h5 class="ms-3" id="loadingText">กำลังดำเนินการ...</h5>
</div>

<div id="loginPage" class="login-container">
    <div class="login-card p-4 text-center" style="max-width: 400px; width: 100%;">
        <i class="fas fa-user-shield fa-3x text-primary mb-3"></i>
        <h4>ศพด.ทับกวาง (ป่าไผ่)</h4>
        <input type="password" id="passInput" class="form-control my-3 text-center" placeholder="รหัสผ่านผู้ดูแล">
        <button onclick="checkPassword()" class="btn btn-primary w-100">เข้าสู่ระบบ</button>
        <p id="errorMsg" class="text-danger mt-2" style="display:none;">รหัสไม่ถูกต้อง!</p>
    </div>
</div>

<div id="mainContent" class="container">
    <div class="card main-card">
        <div class="header-banner">
            <h2>ระบบจัดการข้อมูลนักเรียน</h2>
            <p>เทศบาลเมืองทับกวาง (ป่าไผ่)</p>
        </div>
        
        <div class="card-body p-4">
            <div class="alert alert-info d-flex align-items-center">
                <i class="fas fa-search me-3"></i>
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control" placeholder="ใส่รหัสประจำตัวเด็กเพื่อค้นหา/แก้ไข">
                    <button class="btn btn-primary" onclick="searchStudent()">ค้นหาข้อมูล</button>
                    <button class="btn btn-secondary" onclick="resetForm()">ล้างค่า</button>
                </div>
            </div>

            <form id="childForm">
                <input type="hidden" name="action" id="formAction" value="insert"> 
                
                <div class="section-title">
                    <span><i class="fas fa-info-circle me-2"></i> ข้อมูลเด็ก</span>
                    <span id="editStatus" class="edit-badge">กำลังแก้ไขข้อมูล</span>
                </div>

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">รหัสประจำตัวนักเรียน</label>
                        <input type="text" name="studentId" id="studentId" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">ชื่อ-นามสกุล</label>
                        <input type="text" name="fullName" id="fullName" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">ระดับชั้น</label>
                        <select name="classLevel" id="classLevel" class="form-select" required>
                            <option value="">-- เลือก --</option>
                            <option>เตรียมอนุบาล</option>
                            <option>อนุบาล ๑</option>
                            <option>อนุบาล ๒/๑</option>
                            <option>อนุบาล ๒/๒</option>
                            <option>อนุบาล ๓</option>
                        </select>
                    </div>
                </div>

                <div class="section-title"><i class="fas fa-map-marker-alt me-2"></i> ข้อมูลที่อยู่</div>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">จังหวัด</label>
                        <select id="province" name="province" class="form-select" required onchange="updateAmphoe()"></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">อำเภอ</label>
                        <select id="amphoe" name="amphoe" class="form-select" required onchange="updateTambon()"></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">ตำบล</label>
                        <select id="tambon" name="tambon" class="form-select" required></select>
                    </div>
                </div>

                <div class="mt-5">
                    <button type="submit" id="submitBtn" class="btn btn-success w-100 p-3 fw-bold">
                        <span id="btnText"><i class="fas fa-save me-2"></i> บันทึกข้อมูลใหม่</span>
                    </button>
                    <button type="button" id="deleteBtn" class="btn btn-danger p-3 fw-bold" style="display:none;" onclick="deleteStudent()">
        <i class="fas fa-trash-alt me-2"></i> ลบ/ลาออก
    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const secretPass = 'tabkwang2024'; // รหัสผ่านเข้าหน้าเว็บ
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxDm4IZpjkJtUZ8vEmU4ptC8EGWs_VcHB8CRpUyX1vFCYZT3-Houf6KDMwJTdgSW5wZ/exec';
    let addressData = [];

    // ล็อกอิน
    function checkPassword() {
        if (document.getElementById('passInput').value === secretPass) {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    }

    // ค้นหาข้อมูลนักเรียน
    function searchStudent() {
        const id = document.getElementById('searchInput').value;
        if (!id) return alert('กรุณากรอกรหัสประจำตัวที่ต้องการค้นหา');

        showLoading('กำลังค้นหาข้อมูล...');

        // ส่ง Request ไปที่ Google Apps Script (ต้องมีฟังก์ชัน search ในหลังบ้าน)
        fetch(`${scriptURL}?action=search&id=${id}`)
            .then(res => res.json())
            .then(data => {
                hideLoading();
                if (data.status === 'found') {
                    fillForm(data.result);
                } else {
                    alert('ไม่พบข้อมูลรหัสนักเรียนนี้');
                }
            })
            .catch(err => {
                hideLoading();
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
            });
    }

    // เติมข้อมูลลงฟอร์มเมื่อค้นหาเจอ
    function fillForm(data) {
        document.getElementById('formAction').value = 'update';
        document.getElementById('studentId').value = data.studentId;
        document.getElementById('fullName').value = data.fullName;
        document.getElementById('classLevel').value = data.classLevel;
        
        // เลือกจังหวัด/อำเภอ/ตำบล (ต้องรอให้โหลด List เสร็จก่อน)
        document.getElementById('province').value = data.province;
        updateAmphoe(); 
        setTimeout(() => {
            document.getElementById('amphoe').value = data.amphoe;
            updateTambon();
            setTimeout(() => {
                document.getElementById('tambon').value = data.tambon;
            }, 300);
        }, 300);

        document.getElementById('editStatus').style.display = 'block';
        document.getElementById('btnText').innerHTML = '<i class="fas fa-edit me-2"></i> อัปเดตข้อมูลเดิม';
        document.getElementById('submitBtn').className = 'btn btn-warning w-100 p-3 fw-bold';
    }

    function resetForm() {
        document.getElementById('childForm').reset();
        document.getElementById('formAction').value = 'insert';
        document.getElementById('editStatus').style.display = 'none';
        document.getElementById('btnText').innerHTML = '<i class="fas fa-save me-2"></i> บันทึกข้อมูลใหม่';
        document.getElementById('submitBtn').className = 'btn btn-success w-100 p-3 fw-bold';
    }

    // โหลดที่อยู่ ก-ฮ
    fetch('https://raw.githubusercontent.com/kongvut/thai-province-data/master/api/latest/province_with_district_and_sub_district.json')
        .then(res => res.json())
        .then(data => {
            addressData = data;
            const provSelect = document.getElementById('province');
            provSelect.innerHTML = '<option value="">-- จังหวัด --</option>';
            data.sort((a,b) => a.name_th.localeCompare(b.name_th, 'th')).forEach(p => provSelect.add(new Option(p.name_th, p.name_th)));
        });

    function updateAmphoe() {
        const prov = addressData.find(p => p.name_th === document.getElementById('province').value);
        const ampSelect = document.getElementById('amphoe');
        ampSelect.innerHTML = '<option value="">-- อำเภอ --</option>';
        if (prov) {
            (prov.district || prov.amphure).sort((a,b) => a.name_th.localeCompare(b.name_th, 'th')).forEach(d => ampSelect.add(new Option(d.name_th, d.name_th)));
        }
    }

    function updateTambon() {
        const prov = addressData.find(p => p.name_th === document.getElementById('province').value);
        const amp = (prov?.district || prov?.amphure)?.find(d => d.name_th === document.getElementById('amphoe').value);
        const tamSelect = document.getElementById('tambon');
        tamSelect.innerHTML = '<option value="">-- ตำบล --</option>';
        if (amp) {
            (amp.sub_district || amp.tambon).sort((a,b) => a.name_th.localeCompare(b.name_th, 'th')).forEach(t => tamSelect.add(new Option(t.name_th, t.name_th)));
        }
    }

    // บันทึก/อัปเดตข้อมูล
    document.getElementById('childForm').addEventListener('submit', e => {
        e.preventDefault();
        showLoading('กำลังบันทึกข้อมูล...');
        const formData = Object.fromEntries(new FormData(e.target).entries());
        
        fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(formData) })
            .then(() => {
                hideLoading();
                alert('ดำเนินการสำเร็จ!');
                resetForm();
            })
            .catch(() => {
                hideLoading();
                alert('เกิดข้อผิดพลาด');
            });
    });
// ฟังก์ชันลบข้อมูล
function deleteStudent() {
    const id = document.getElementById('studentId').value;
    const name = document.getElementById('fullName').value;

    if (confirm(`คุณครูยืนยันที่จะลบข้อมูลของ " ${name} " ใช่หรือไม่?\n(ข้อมูลจะถูกลบออกจากฐานข้อมูลถาวร)`)) {
        showLoading('กำลังลบข้อมูล...');
        
        // ส่ง Request แบบ POST โดยระบุ action: 'delete'
        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                action: 'delete',
                studentId: id
            })
        })
        .then(() => {
            hideLoading();
            alert('ลบข้อมูลเรียบร้อยแล้ว');
            resetForm(); // ล้างฟอร์มกลับเป็นหน้าว่าง
        })
        .catch(err => {
            hideLoading();
            alert('เกิดข้อผิดพลาดในการลบ');
        });
    }
}

// แก้ไขฟังก์ชัน fillForm เดิมให้โชว์ปุ่มลบด้วย
function fillForm(data) {
    // ... โค้ดเดิมที่คุณครูมี ...
    document.getElementById('deleteBtn').style.display = 'block'; // โชว์ปุ่มลบ
}

// แก้ไขฟังก์ชัน resetForm เดิมให้ซ่อนปุ่มลบด้วย
function resetForm() {
    // ... โค้ดเดิมของคุณครูมี ...
    document.getElementById('deleteBtn').style.display = 'none'; // ซ่อนปุ่มลบ
}
    function showLoading(msg) { 
        document.getElementById('loadingText').innerText = msg;
        document.getElementById('loadingOverlay').style.display = 'flex'; 
    }
    function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }
</script>
</body>
</html>
