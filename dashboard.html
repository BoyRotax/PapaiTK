<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ศูนย์พัฒนาเด็กเล็กเทศบาลเมืองทับกวาง (ป่าไผ่)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; }
        .sidebar { background: #343a40; color: white; min-height: 100vh; padding-top: 20px; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; font-weight: 600; }
        .sidebar a:hover, .sidebar a.active { color: white; background: #495057; border-left: 4px solid #f39c12; }
        .card-stat { border-radius: 15px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
/* ================= ปรับแต่งตารางหน้าเว็บให้เป็นสไตล์ Minimal ================= */
        #studentTable {
            font-size: 85%; /* ลดขนาดตัวอักษรลงจากปกติ */
        }
        #studentTable th, #studentTable td {
            border-left: none !important; /* ลบขอบซ้าย */
            border-right: none !important; /* ลบขอบขวา */
            vertical-align: middle;
        }
        #studentTable thead th {
            border-bottom: 2px solid #ccc !important; /* เส้นใต้หัวตารางหนาหน่อย */
            background-color: #f4f7f6;
        }

        /* ================= ซ่อนส่วนที่ไม่ต้องการตอนปริ๊น (Smart Print CSS) ================= */
        @media print {
            body { background-color: white; }
            .sidebar, .navbar, .btn, #roomFilterContainer, #summaryCards, 
            .dataTables_filter, .dataTables_info, .dataTables_paginate, .dataTables_length { 
                display: none !important; 
            }
            #printHeader { display: block !important; }
            .col-md-10 { width: 100% !important; flex: 0 0 100%; max-width: 100%; padding: 0 !important; }
            .card { border: none !important; box-shadow: none !important; }
            
            /* 🌟 ปรับขนาดตัวอักษรตอนปริ๊นให้เล็กลง 30% (จาก 14pt เหลือ 10pt) */
            table { font-size: 10pt !important; width: 100% !important; border-collapse: collapse !important; }
            
            /* 🌟 เอาเส้นขอบตารางออกให้หมด เหลือแค่ขีดเส้นใต้บางๆ กั้นแถว */
            th, td { 
                border: none !important; 
                border-bottom: 1px solid #eeeeee !important; 
                padding: 6px 8px !important; 
                color: black !important; 
            }
            
            /* 🌟 บังคับให้สีสลับแถว (Zebra) โชว์ใน PDF ด้วย (ปกติ Chrome จะตัดสีทิ้ง) */
            tr:nth-child(even) td {
                background-color: #f9f9f9 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            
            a { text-decoration: none !important; color: black !important; pointer-events: none; }
            i.fa-edit { display: none !important; }
        }
    </style>
</head>
<body>

<script>
    if (sessionStorage.getItem('isLoggedIn') !== 'true') {
        window.location.href = 'index.html';
    }
</script>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar d-none d-md-block">
            <div class="text-center mb-4">
                <i class="fas fa-school fa-3x text-warning mb-2"></i>
                <h6 class="text-light">ศพด. ทับกวาง (ป่าไผ่)</h6>
            </div>
            <a href="dashboard.html" class="active"><i class="fas fa-chart-pie me-2"></i> แดชบอร์ด</a>
            <a href="regdata.html"><i class="fas fa-user-plus me-2"></i> เพิ่มข้อมูลนักเรียน</a>
            <a href="teachers.html"><i class="fas fa-chalkboard-teacher me-2"></i> ข้อมูลบุคลากร/ครู</a>
            <hr class="text-secondary">
            <a href="#" onclick="logout()" class="text-danger"><i class="fas fa-sign-out-alt me-2"></i> ออกจากระบบ</a>
        </div>

        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold"><i class="fas fa-chart-pie"></i> แดชบอร์ดสรุปข้อมูล</h3>
                <div class="badge bg-primary fs-6 p-2 rounded-pill">
                    <i class="fas fa-user me-1"></i> <span id="displayUserName">กำลังโหลด...</span>
                </div>
            </div>

            <div class="row mb-4" id="summaryCards">
                <div class="col-md-3">
                    <div class="card card-stat bg-primary text-white p-3">
                        <h5>นักเรียนทั้งหมด</h5>
                        <h2 id="totalStudents">0</h2>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-stat bg-info text-white p-3">
                        <h5>นักเรียนชาย</h5>
                        <h2 id="totalMale">0</h2>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-stat bg-danger text-white p-3">
                        <h5>นักเรียนหญิง</h5>
                        <h2 id="totalFemale">0</h2>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-stat bg-success text-white p-3">
                        <h5>จำนวนครู</h5>
                        <h2 id="totalTeachers">0</h2>
                    </div>
                </div>
            </div>

            <div class="card card-stat p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold m-0"><i class="fas fa-list"></i> รายชื่อนักเรียน</h5>
                    <a href="regdata.html" class="btn btn-success btn-sm"><i class="fas fa-plus"></i> เพิ่มนักเรียน</a>
                </div>

                <div class="row mb-3 bg-light p-3 rounded align-items-end" id="roomFilterContainer">
                    <div class="col-md-3">
                        <label class="form-label fw-bold">ระดับชั้น:</label>
                        <select id="filterClass" class="form-select form-select-sm">
                            <option value="">-- แสดงทั้งหมด --</option>
                            <option value="เตรียมอนุบาล">เตรียมอนุบาล</option>
                            <option value="อนุบาล 1">อนุบาล 1</option>
                            <option value="อนุบาล 2">อนุบาล 2</option>
                            <option value="อนุบาล 3">อนุบาล 3</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">ห้อง:</label>
                        <select id="filterRoom" class="form-select form-select-sm">
                            <option value="">-- แสดงทั้งหมด --</option>
                            <option value="1">ห้อง 1</option>
                            <option value="2">ห้อง 2</option>
                            <option value="3">ห้อง 3</option>
                        </select>
                    </div>
                    <div class="col-md-6 text-end">
                        <button class="btn btn-danger fw-bold shadow-sm" onclick="printTable()"><i class="fas fa-file-pdf"></i> บันทึกเป็น PDF / พิมพ์</button>
                    </div>
                </div>

                <div id="printHeader" class="text-center mb-4" style="display: none;">
                    <h3 id="printTitle" class="fw-bold text-dark">รายชื่อนักเรียน</h3>
                </div>

                <div class="table-responsive">
                    <table id="studentTable" class="table table-striped table-hover table-borderless w-100">
                        <thead class="table-light">
                            <tr>
                                <th>รหัส</th>
                                <th>ชื่อ-สกุล (คลิกเพื่อแก้ไข)</th>
                                <th>ชื่อเล่น</th>
                                <th>ชั้นเรียน</th>
                                <th>ห้อง</th>
                                <th>เพศ</th>
                                <th>อายุ</th>
                            </tr>
                        </thead>
                        <tbody>
                            </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

<script>
    // ⚠️ นำ Web App URL ของคุณมาใส่ตรงนี้ ⚠️
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzoIkW_e_OeG-pW4_5vBUrLI64xwmVEXjKQxVifUjUWn7QrwY1TVd9Zdj7UwMPRng5I_w/exec'; 

    document.getElementById('displayUserName').innerText = sessionStorage.getItem('userName') || 'ผู้ดูแลระบบ';

    function logout() {
        sessionStorage.clear();
        window.location.href = 'index.html';
    }

    let dataTable; // ประกาศตัวแปรเก็บตารางไว้ด้านนอกสุด

    function loadDashboardData() {
        // ดึงข้อมูลนักเรียน
        fetch(scriptURL + '?action=getStudents')
            .then(res => res.json())
            .then(data => {
                document.getElementById('totalStudents').innerText = data.length;
                document.getElementById('totalMale').innerText = data.filter(s => s.Gender === 'ชาย').length;
                document.getElementById('totalFemale').innerText = data.filter(s => s.Gender === 'หญิง').length;

                // สร้างตาราง
                dataTable = $('#studentTable').DataTable({
                    data: data,
                    columns: [
                        { data: 'StudentId' },
                        { 
                            data: 'FullName',
                            render: function(data, type, row) {
                                return `<a href="regdata.html?id=${row.StudentId}" class="text-decoration-none fw-bold text-primary" title="คลิกเพื่อแก้ไขข้อมูล"><i class="fas fa-edit"></i> ${data}</a>`;
                            }
                        },
                        { data: 'NickName' },
                        { data: 'ClassLevel' },
                        { data: 'Room' },
                        { data: 'Gender' },
                        { 
                            data: 'BirthDate',
                            render: function(data, type, row) {
                                return getAgeInThai(data); 
                            }
                        }
                    ],
                    language: { url: '//cdn.datatables.net/plug-ins/1.13.4/i18n/th.json' }
                });

                // ผูก Event ให้กับตัวกรอง ชั้นเรียน และ ห้อง หลังจากที่สร้างตารางเสร็จ
                $('#filterClass').on('change', function() {
                    // ค้นหาคอลัมน์ที่ 3 (ชั้นเรียน) แบบเป๊ะๆ
                    let val = this.value ? '^' + this.value + '$' : '';
                    dataTable.column(3).search(val, true, false).draw();
                });
                
                $('#filterRoom').on('change', function() {
                    // ค้นหาคอลัมน์ที่ 4 (ห้อง) แบบเป๊ะๆ
                    let val = this.value ? '^' + this.value + '$' : '';
                    dataTable.column(4).search(val, true, false).draw();
                });
            })
            .catch(err => console.error("โหลดข้อมูลนักเรียนไม่สำเร็จ:", err));

        // ดึงข้อมูลครู
        fetch(scriptURL + '?action=getTeachers')
            .then(res => res.json())
            .then(data => {
                document.getElementById('totalTeachers').innerText = data.length;
            })
            .catch(err => console.error("โหลดข้อมูลครูไม่สำเร็จ:", err));
    }

    // ================= ระบบสั่งพิมพ์อัจฉริยะ (Smart Print) =================
    function printTable() {
        if(!dataTable) return;

        let currentData = dataTable.rows({ search: 'applied' }).data().toArray();
        if(currentData.length === 0) {
            alert("ไม่มีข้อมูลสำหรับพิมพ์");
            return;
        }

        let uniqueClasses = [...new Set(currentData.map(item => item.ClassLevel))];
        let uniqueRooms = [...new Set(currentData.map(item => item.Room))];

        let headerText = "รายชื่อนักเรียน";
        if (uniqueClasses.length === 1 && uniqueClasses[0]) {
            headerText += " ระดับชั้น" + uniqueClasses[0]; 
        }
        
        let hideRoomColumn = false;
        if (uniqueRooms.length === 1) {
            hideRoomColumn = true;
        } else if (uniqueClasses.length === 1 && uniqueRooms.length > 1) {
            headerText += " (รวมทุกห้อง)"; 
        }

        $('#printTitle').text(headerText);

        const oldLength = dataTable.page.len();
        
        if(hideRoomColumn) {
            dataTable.column(4).visible(false);
        }

        dataTable.page.len(-1).draw(false);

        setTimeout(function() {
            window.print();
            
            dataTable.page.len(oldLength);
            if(hideRoomColumn) {
                dataTable.column(4).visible(true); 
            }
            dataTable.draw(false);
        }, 500);
    }

    // ================= ระบบคำนวณอายุเด็ก (รองรับ พ.ศ. อัตโนมัติ) =================
    function getAgeInThai(birthDateString) {
        if (!birthDateString) return "-";
        
        const birthDate = new Date(birthDateString);
        if (isNaN(birthDate.getTime())) return "-";

        let bYear = birthDate.getFullYear();
        if (bYear > 2400) {
            bYear -= 543;
        }

        const today = new Date();
        let years = today.getFullYear() - bYear;
        let months = today.getMonth() - birthDate.getMonth();

        if (today.getDate() < birthDate.getDate()) {
            months--;
        }
        
        if (months < 0) {
            years--;
            months += 12;
        }

        if (years < 0) return "-";
        if (years === 0 && months === 0) return "ไม่ถึง 1 เดือน";

        let result = "";
        if (years > 0) result += years + " ขวบ ";
        if (months > 0) result += months + " เดือน";

        return result.trim();
    }

    // ================= เริ่มทำงานเมื่อโหลดหน้าเว็บเสร็จ =================
    $(document).ready(function() {
        loadDashboardData();
    });

</script>
</body>
</html>
