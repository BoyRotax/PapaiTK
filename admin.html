<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผู้ดูแลระบบ - เพิ่มบุคลากร ศพด.ทับกวาง (ป่าไผ่)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; padding-top: 20px; }
        .main-card { border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: none; }
        /* เปลี่ยนสี Header สำหรับหน้า Admin เพื่อให้รู้ว่าอยู่คนละหน้า */
        .header-banner { background: #343a40; color: white; padding: 30px; text-align: center; border-radius: 20px 20px 0 0; }
        .section-title { background: #f8f9fa; border-left: 5px solid #28a745; padding: 10px; margin: 25px 0 15px 0; font-weight: 600; }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">
    <div class="spinner-border text-success"></div>
    <h5 class="ms-3">กำลังบันทึกข้อมูลบุคลากร...</h5>
</div>

<div class="container mb-5">
    <div class="card main-card">
        <div class="header-banner">
            <i class="fas fa-user-tie fa-2x mb-2"></i>
            <h2>ส่วนจัดการบุคลากร (Admin)</h2>
            <p>ศพด.เทศบาลเมืองทับกวาง (ป่าไผ่)</p>
        </div>
        <div class="card-body p-4">
            <form id="teacherForm">
                <input type="hidden" name="formType" value="teacher">

                <div class="section-title">ข้อมูลบุคลากร / ครูประจำชั้น</div>
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">คำนำหน้า</label>
                        <select name="title" class="form-select" required>
                            <option value="">-- เลือก --</option>
                            <option value="นาย">นาย</option>
                            <option value="นาง">นาง</option>
                            <option value="นางสาว">นางสาว</option>
                            <option value="คุณครู">คุณครู</option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">ชื่อ-นามสกุล</label>
                        <input type="text" name="teacherName" class="form-control" placeholder="เช่น สะแกลวัลย์ รักเด็ก" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">เบอร์โทรศัพท์</label>
                        <input type="tel" name="teacherTel" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">ตำแหน่ง</label>
                        <select name="position" class="form-select" required>
                            <option value="">-- เลือกตำแหน่ง --</option>
                            <option value="ครูประจำชั้น">ครูประจำชั้น</option>
                            <option value="ผู้ดูแลเด็ก">ผู้ดูแลเด็ก</option>
                            <option value="หัวหน้าศูนย์พัฒนาเด็กเล็ก">หัวหน้าศูนย์พัฒนาเด็กเล็ก</option>
                            <option value="เจ้าหน้าที่ธุรการ">เจ้าหน้าที่ธุรการ</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">รับผิดชอบชั้นเรียน (ถ้ามี)</label>
                        <select name="assignedClass" class="form-select">
                            <option value="-">-- ไม่ระบุ / ไม่ได้เป็นครูประจำชั้น --</option>
                            <option value="เตรียมอนุบาล">เตรียมอนุบาล</option>
                            <option value="อนุบาล ๑">อนุบาล ๑</option>
                            <option value="อนุบาล ๒/๑">อนุบาล ๒/๑</option>
                            <option value="อนุบาล ๒/๒">อนุบาล ๒/๒</option>
                            <option value="อนุบาล ๓">อนุบาล ๓</option>
                        </select>
                    </div>
                </div>

                <div class="alert alert-info mt-4">
                    <i class="fas fa-info-circle"></i> <strong>คำแนะนำ:</strong> เมื่อบันทึกข้อมูลแล้ว ข้อมูลจะถูกส่งไปยัง Google Sheets (แนะนำให้สร้าง Sheet ใหม่ชื่อ "Teacher" ไว้รองรับข้อมูลชุดนี้)
                </div>

                <button type="submit" class="btn btn-dark w-100 mt-3 p-3 fw-bold">
                    <i class="fas fa-save"></i> บันทึกข้อมูลบุคลากร
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    // ใช้ URL เดิมจาก Google Apps Script ได้เลย (แต่ต้องไปปรับโค้ดฝั่งนั้นให้เช็คค่า formType)
    const scriptURL = 'ใส่_URL_ที่ได้จาก_Google_Apps_Script_ของคุณตรงนี้';

    const form = document.getElementById('teacherForm');
    form.addEventListener('submit', e => {
        e.preventDefault();
        
        document.getElementById('loadingOverlay').style.display = 'flex';
        fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(Object.fromEntries(new FormData(form).entries()))})
        .then(() => {
            document.getElementById('loadingOverlay').style.display = 'none';
            alert('บันทึกข้อมูลบุคลากรสำเร็จ!');
            form.reset();
        })
        .catch(() => {
            document.getElementById('loadingOverlay').style.display = 'none';
            alert('เกิดข้อผิดพลาดในการบันทึก!');
        });
    });
</script>
</body>
</html>
