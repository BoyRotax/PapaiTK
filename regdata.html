<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เพิ่มข้อมูลนักเรียน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> body { font-family: 'Sarabun', sans-serif; background-color: #f8f9fa; } </style>
</head>
<body class="p-4">
    <div class="container bg-white p-4 rounded shadow-sm max-w-75">
        <div class="d-flex justify-content-between mb-4">
            <h2>ฟอร์มบันทึกข้อมูลนักเรียน</h2>
            <a href="dashboard.html" class="btn btn-secondary">กลับหน้า Dashboard</a>
        </div>
        
        <form id="studentForm">
            <div class="row mb-3">
                <div class="col-md-3">
                    <label>รหัสนักเรียน</label>
                    <input type="text" name="StudentId" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label>ชั้นเรียน</label>
                    <select name="ClassLevel" class="form-select">
                        <option value="เตรียมอนุบาล">เตรียมอนุบาล</option>
                        <option value="อนุบาล 1">อนุบาล 1</option>
                        <option value="อนุบาล 2">อนุบาล 2</option>
                        <option value="อนุบาล 3">อนุบาล 3</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label>ห้อง</label>
                    <input type="number" name="Room" class="form-control" value="1">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>ชื่อ-นามสกุล</label>
                    <input type="text" name="FullName" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label>ชื่อเล่น</label>
                    <input type="text" name="NickName" class="form-control">
                </div>
                <div class="col-md-3">
                    <label>เพศ</label>
                    <select name="Gender" class="form-select">
                        <option value="ชาย">ชาย</option>
                        <option value="หญิง">หญิง</option>
                    </select>
                </div>
            </div>

            <h5 class="mt-4 border-bottom pb-2">ข้อมูลที่อยู่</h5>
            <div class="row mb-3">
                <div class="col-md-3">
                    <label>จังหวัด</label>
                    <select id="province" name="Province" class="form-select"></select>
                </div>
                <div class="col-md-3">
                    <label>อำเภอ</label>
                    <select id="amphoe" name="Amphoe" class="form-select" disabled></select>
                </div>
                <div class="col-md-3">
                    <label>ตำบล</label>
                    <select id="tambon" name="Tambon" class="form-select" disabled></select>
                </div>
                <div class="col-md-3">
                    <label>รายละเอียดที่อยู่ (บ้านเลขที่/หมู่)</label>
                    <input type="text" name="AddressDetail" class="form-control">
                </div>
            </div>

            <button type="submit" class="btn btn-success mt-3 w-100">บันทึกข้อมูล</button>
        </form>
    </div>

    <script>
        const API_URL = 'ใส่_URL_WEB_APP_ของคุณที่นี่'; // <<--- เปลี่ยนตรงนี้

        // ---------------- ระบบที่อยู่ สระบุรี ----------------
        const THAI_DATA_URL = 'https://raw.githubusercontent.com/kongvut/thai-province-data/master/api_province_with_amphoe_tambon.json';
        let locationData = [];

        fetch(THAI_DATA_URL).then(res => res.json()).then(data => {
            locationData = data;
            const provSelect = document.getElementById('province');
            
            // วนลูปจังหวัด
            data.forEach(p => {
                provSelect.innerHTML += `<option value="${p.name_th}">${p.name_th}</option>`;
            });
            
            // ตั้งค่าเริ่มต้นเป็น "สระบุรี"
            provSelect.value = "สระบุรี";
            updateAmphoe(); 
        });

        document.getElementById('province').addEventListener('change', updateAmphoe);
        document.getElementById('amphoe').addEventListener('change', updateTambon);

        function updateAmphoe() {
            const provName = document.getElementById('province').value;
            const ampSelect = document.getElementById('amphoe');
            ampSelect.innerHTML = '<option value="">เลือกอำเภอ</option>';
            ampSelect.disabled = false;
            document.getElementById('tambon').disabled = true;
            document.getElementById('tambon').innerHTML = '<option value="">เลือกตำบล</option>';

            const provData = locationData.find(p => p.name_th === provName);
            if(provData) {
                provData.amphoe.forEach(a => {
                    ampSelect.innerHTML += `<option value="${a.name_th}">${a.name_th}</option>`;
                });
            }
        }

        function updateTambon() {
            const provName = document.getElementById('province').value;
            const ampName = document.getElementById('amphoe').value;
            const tamSelect = document.getElementById('tambon');
            tamSelect.innerHTML = '<option value="">เลือกตำบล</option>';
            tamSelect.disabled = false;

            const provData = locationData.find(p => p.name_th === provName);
            if(provData) {
                const ampData = provData.amphoe.find(a => a.name_th === ampName);
                if(ampData) {
                    ampData.tambon.forEach(t => {
                        tamSelect.innerHTML += `<option value="${t.name_th}">${t.name_th}</option>`;
                    });
                }
            }
        }

        // ---------------- ระบบบันทึกข้อมูล ----------------
        document.getElementById('studentForm').onsubmit = function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const dataObj = Object.fromEntries(formData.entries());
            
            // ปรับปุ่มระหว่างบันทึก
            const btn = this.querySelector('button[type="submit"]');
            btn.innerHTML = 'กำลังบันทึก...'; btn.disabled = true;

            fetch(API_URL + '?action=saveStudent', {
                method: 'POST',
                body: JSON.stringify(dataObj)
            })
            .then(res => res.json())
            .then(res => {
                if(res.status === 'success') {
                    alert('บันทึกข้อมูลสำเร็จ!');
                    this.reset();
                    document.getElementById('province').value = "สระบุรี";
                    updateAmphoe();
                }
                btn.innerHTML = 'บันทึกข้อมูล'; btn.disabled = false;
            });
        };
    </script>
</body>
</html>
