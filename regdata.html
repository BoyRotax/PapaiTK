<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกข้อมูล - ศพด.ทับกวาง (ป่าไผ่)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; padding-top: 20px; }
        .main-card { border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: none; }
        .header-banner { background: #007bff; color: white; padding: 30px; text-align: center; border-radius: 20px 20px 0 0; }
        .section-title { background: #f8f9fa; border-left: 5px solid #007bff; padding: 10px; margin: 25px 0 15px 0; font-weight: 600; }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; justify-content: center; align-items: center; }
    </style>
</head>
<body>
<script>
    if (sessionStorage.getItem('isLoggedIn') !== 'true') {
        window.location.href = 'index.html'; // เตะกลับไปหน้า Login
    }
    function logout() {
        sessionStorage.removeItem('isLoggedIn'); // ลบสถานะ
        window.location.href = 'index.html'; // กลับไปหน้า Login
    }
</script>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-warning" href="dashboard.html"><i class="fas fa-school"></i> ศพด.ทับกวาง</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="regdata.html"><i class="fas fa-user-plus"></i> เพิ่มนักเรียน</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="admin.html"><i class="fas fa-user-tie"></i> เพิ่มบุคลากร</a>
                </li>
            </ul>
            <button class="btn btn-danger btn-sm rounded-pill px-3" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
            </button>
        </div>
    </div>
</nav>
<div id="loadingOverlay" class="loading-overlay">
    <div class="spinner-border text-primary"></div>
    <h5 class="ms-3">กำลังบันทึกข้อมูล...</h5>
</div>

<div class="container mb-5">
    <div class="card main-card">
        <div class="header-banner">
            <i class="fas fa-school fa-2x mb-2"></i>
            <h2>ระบบบันทึกข้อมูลนักเรียน</h2>
            <br>ศูนย์พัฒนาเด็กเล็กเทศบาลเมืองทับกวาง (ป่าไผ่)<br>
        </div>
        <div class="card-body p-4">
            <form id="childForm">
                
                <div class="section-title">1. ข้อมูลพื้นฐาน</div>
                <div class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label">ระดับชั้น</label>
                        <select id="classLevel" name="classLevel" class="form-select" required onchange="generateStudentId()">
                            <option value="" data-code="">-- เลือก --</option>
                            <option value="เตรียมอนุบาล" data-code="0">เตรียมอนุบาล</option>
                            <option value="อนุบาล ๑" data-code="1">อนุบาล ๑</option>
                            <option value="อนุบาล ๒" data-code="2">อนุบาล ๒</option>
                            <option value="อนุบาล ๓" data-code="3">อนุบาล ๓</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">ห้อง</label>
                        <select id="roomLevel" name="room" class="form-select" required onchange="generateStudentId()">
                            <option value="1">๑</option>
                            <option value="2">๒</option>
                            <option value="3">๓</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">ลำดับที่</label>
                        <input type="text" id="runningNumber" class="form-control" placeholder="เช่น 1 หรือ 01" maxlength="2" oninput="generateStudentId()" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">รหัสประจำตัว</label>
                        <input type="text" name="studentId" id="studentId" class="form-control bg-light" placeholder="อัตโนมัติ" readonly required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">ชื่อ-นามสกุล</label>
                        <input type="text" name="fullName" class="form-control" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">ชื่อเล่น</label>
                        <input type="text" name="nickName" class="form-control">
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">วันเกิด (พ.ศ.)</label>
                        <div class="input-group">
                            <select id="bDay" class="form-select" required></select>
                            <select id="bMonth" class="form-select" required></select>
                            <select id="bYear" class="form-select" required></select>
                        </div>
                        <input type="hidden" name="birthDate" id="birthDate">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">เพศ</label>
                        <select name="gender" class="form-select"><option>ชาย</option><option>หญิง</option></select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">กรุ๊ปเลือด</label>
                        <select name="bloodType" class="form-select"><option>-</option><option>A</option><option>B</option><option>AB</option><option>O</option></select>
                    </div>
                </div>

                <div class="section-title">2. ข้อมูลที่อยู่</div>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">จังหวัด</label>
                        <select id="province" name="province" class="form-select" required onchange="updateAmphoe()"></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">อำเภอ/เขต</label>
                        <select id="amphoe" name="amphoe" class="form-select" required onchange="updateTambon()"></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">ตำบล/แขวง</label>
                        <select id="tambon" name="tambon" class="form-select" required></select>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">รายละเอียด (บ้านเลขที่/หมู่/ซอย)</label>
                        <input type="text" name="addressDetail" class="form-control">
                    </div>
                </div>

                <div class="section-title">3. ข้อมูลบิดา-มารดา</div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">ชื่อ-สกุล บิดา</label>
                        <input type="text" name="fatherName" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">เบอร์โทรศัพท์ บิดา</label>
                        <input type="tel" name="fatherTel" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">ชื่อ-สกุล มารดา</label>
                        <input type="text" name="motherName" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">เบอร์โทรศัพท์ มารดา</label>
                        <input type="tel" name="motherTel" class="form-control">
                    </div>
                </div>

                <div class="section-title">4. ติดต่อฉุกเฉิน (ผู้ปกครอง)</div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">ชื่อผู้ติดต่อฉุกเฉิน</label>
                        <input type="text" name="parentName" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">เบอร์โทรศัพท์ฉุกเฉิน</label>
                        <input type="tel" name="emergencyTel" class="form-control" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-success w-100 mt-5 p-3 fw-bold">
                    <i class="fas fa-save"></i> บันทึกข้อมูล
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwor6FeIFLccMvMZCAS0a71jYlvkc3yGE5Z9DnJ7EfyKrz34ZeNszMj2l5rhxHuaylg/exec';
    let addressData = [];

    // 1. ระบบวันเดือนปีเกิด
    const bDay = document.getElementById('bDay');
    const bMonth = document.getElementById('bMonth');
    const bYear = document.getElementById('bYear');

    bDay.innerHTML = '<option value="">วัน</option>' + Array.from({length: 31}, (_, i) => `<option value="${i+1}">${i+1}</option>`).join('');
    const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
    bMonth.innerHTML = '<option value="">เดือน</option>' + thaiMonths.map(m => `<option value="${m}">${m}</option>`).join('');
    
    const currentYearBE = new Date().getFullYear() + 543;
    let yearOptions = '<option value="">ปี พ.ศ.</option>';
    for (let i = currentYearBE; i >= currentYearBE - 15; i--) {
        yearOptions += `<option value="${i}">${i}</option>`;
    }
    bYear.innerHTML = yearOptions;

    // 2. ระบบสร้างรหัสประจำตัวนักเรียน (รูปแบบใหม่ 6 หลัก: ปี2 + ชั้น1 + ห้อง1 + ลำดับ2)
    function generateStudentId() {
        const classSelect = document.getElementById('classLevel');
        const roomSelect = document.getElementById('roomLevel');
        const runningNo = document.getElementById('runningNumber').value;
        const studentIdField = document.getElementById('studentId');
        
        const yearCode = currentYearBE.toString().slice(-2); 
        const selectedOption = classSelect.options[classSelect.selectedIndex];
        const classCode = selectedOption.getAttribute('data-code');
        const roomCode = roomSelect.value;
        
        if (classCode && roomCode && runningNo) {
            const formattedRunningNo = runningNo.replace(/\D/g,'').padStart(2, '0'); 
            studentIdField.value = `${yearCode}${classCode}${roomCode}${formattedRunningNo}`;
        } else {
            studentIdField.value = '';
        }
    }

    // 3. ระบบที่อยู่
    fetch('https://raw.githubusercontent.com/kongvut/thai-province-data/master/api/latest/province_with_district_and_sub_district.json')
        .then(res => res.json())
        .then(data => {
            addressData = data;
            const provSelect = document.getElementById('province');
            provSelect.innerHTML = '<option value="">-- เลือกจังหวัด --</option>';
            data.sort((a,b) => a.name_th.localeCompare(b.name_th, 'th'))
                .forEach(p => provSelect.add(new Option(p.name_th, p.name_th)));
        });

    function updateAmphoe() {
        const provName = document.getElementById('province').value;
        const ampSelect = document.getElementById('amphoe');
        const tamSelect = document.getElementById('tambon');
        
        ampSelect.innerHTML = '<option value="">-- เลือกอำเภอ --</option>';
        tamSelect.innerHTML = '<option value="">-- เลือกตำบล --</option>';
        
        const prov = addressData.find(p => p.name_th === provName);
        if (prov) {
            const districts = prov.districts || prov.district || prov.amphures || prov.amphure || [];
            districts.sort((a,b) => a.name_th.localeCompare(b.name_th, 'th'))
                .forEach(d => ampSelect.add(new Option(d.name_th, d.name_th)));
        }
    }

    function updateTambon() {
        const provName = document.getElementById('province').value;
        const ampName = document.getElementById('amphoe').value;
        const tamSelect = document.getElementById('tambon');
        tamSelect.innerHTML = '<option value="">-- เลือกตำบล --</option>';
        
        const prov = addressData.find(p => p.name_th === provName);
        const districts = prov?.districts || prov?.district || prov?.amphures || prov?.amphure || [];
        const amp = districts.find(d => d.name_th === ampName);
        
        if (amp) {
            const tambons = amp.sub_districts || amp.sub_district || amp.tambons || amp.tambon || [];
            tambons.sort((a,b) => a.name_th.localeCompare(b.name_th, 'th'))
                .forEach(t => tamSelect.add(new Option(t.name_th, t.name_th)));
        }
    }

    // 4. การส่งข้อมูลไป Google Sheets
    const form = document.getElementById('childForm');
    form.addEventListener('submit', e => {
        e.preventDefault();
        document.getElementById('birthDate').value = `${bDay.value} ${bMonth.value} ${bYear.value}`;
        document.getElementById('loadingOverlay').style.display = 'flex';
        fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(Object.fromEntries(new FormData(form).entries()))})
        .then(() => {
            document.getElementById('loadingOverlay').style.display = 'none';
            alert('บันทึกสำเร็จ!');
            form.reset();
        })
        .catch(() => {
            document.getElementById('loadingOverlay').style.display = 'none';
            alert('เกิดข้อผิดพลาด!');
        });
    });
</script>
</body>
</html>
