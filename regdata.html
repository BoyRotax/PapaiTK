<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการข้อมูลนักเรียน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> 
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; }
        .card-form { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .section-title { border-bottom: 2px solid #f39c12; padding-bottom: 5px; margin-bottom: 20px; color: #343a40; font-weight: bold;}
    </style>
</head>
<body class="p-4">

<!-- เช็ค Login -->
<script>
    if (sessionStorage.getItem('isLoggedIn') !== 'true') { window.location.href = 'index.html'; }
</script>

<div class="container max-w-75">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 id="pageTitle" class="fw-bold"><i class="fas fa-user-plus text-primary"></i> เพิ่มข้อมูลนักเรียนใหม่</h3>
        <a href="dashboard.html" class="btn btn-outline-secondary"><i class="fas fa-arrow-left"></i> กลับหน้าแดชบอร์ด</a>
    </div>
    
    <div class="card card-form p-4 bg-white">
        <!-- ฟอร์มข้อมูล -->
        <form id="studentForm">
            <!-- ⚠️ ฟิลด์ซ่อนสำหรับบอกให้ระบบรู้ว่าต้องทำอะไร (insert หรือ update) -->
            <input type="hidden" id="actionType" name="action" value="insertStudent">

            <!-- ส่วนที่ 1: ข้อมูลนักเรียน -->
            <h5 class="section-title"><i class="fas fa-id-card"></i> ข้อมูลนักเรียน</h5>
            <div class="row mb-3">
                <div class="col-md-3">
                    <label class="form-label fw-bold">รหัสนักเรียน <span class="text-danger">*</span></label>
                    <input type="text" id="studentId" name="studentId" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">ระดับชั้น</label>
                    <select name="classLevel" id="classLevel" class="form-select">
                        <option value="เตรียมอนุบาล">เตรียมอนุบาล</option>
                        <option value="อนุบาล 1">อนุบาล 1</option>
                        <option value="อนุบาล 2">อนุบาล 2</option>
                        <option value="อนุบาล 3">อนุบาล 3</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">ห้อง</label>
                    <input type="number" name="room" id="room" class="form-control" value="1">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-5">
                    <label class="form-label fw-bold">ชื่อ-นามสกุล <span class="text-danger">*</span></label>
                    <input type="text" name="fullName" id="fullName" class="form-control" placeholder="ด.ช. / ด.ญ." required>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">ชื่อเล่น</label>
                    <input type="text" name="nickName" id="nickName" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">เพศ</label>
                    <select name="gender" id="gender" class="form-select">
                        <option value="ชาย">ชาย</option>
                        <option value="หญิง">หญิง</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">กรุ๊ปเลือด</label>
                    <select name="bloodType" id="bloodType" class="form-select">
                        <option value="-">-</option>
                        <option value="A">A</option><option value="B">B</option>
                        <option value="O">O</option><option value="AB">AB</option>
                    </select>
                </div>
            </div>

            <!-- วันเกิด -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <label class="form-label fw-bold">วัน/เดือน/ปีเกิด</label>
                    <input type="date" name="birthDate" id="birthDate" class="form-control">
                </div>
            </div>

            <!-- ส่วนที่ 2: ที่อยู่ -->
            <h5 class="section-title"><i class="fas fa-home"></i> ข้อมูลที่อยู่</h5>
            <div class="row mb-4">
                <div class="col-md-4">
                    <label class="form-label fw-bold">บ้านเลขที่/หมู่/ซอย</label>
                    <input type="text" name="addressDetail" id="addressDetail" class="form-control" placeholder="เช่น 123/4 ม.5">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">จังหวัด</label>
                    <select id="province" name="province" class="form-select"></select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">อำเภอ</label>
                    <select id="amphoe" name="amphoe" class="form-select" disabled></select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">ตำบล</label>
                    <select id="tambon" name="tambon" class="form-select" disabled></select>
                </div>
            </div>

            <!-- ส่วนที่ 3: ผู้ปกครอง -->
            <h5 class="section-title"><i class="fas fa-users"></i> ข้อมูลผู้ปกครอง</h5>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">ชื่อบิดา</label>
                    <input type="text" name="fatherName" id="fatherName" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">เบอร์โทรบิดา</label>
                    <input type="text" name="fatherTel" id="fatherTel" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">ชื่อมารดา</label>
                    <input type="text" name="motherName" id="motherName" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">เบอร์โทรมารดา</label>
                    <input type="text" name="motherTel" id="motherTel" class="form-control">
                </div>
            </div>
            <div class="row mb-4 bg-light p-3 rounded">
                <div class="col-md-6">
                    <label class="form-label fw-bold text-danger">กรณีฉุกเฉิน ติดต่อใคร (ชื่อ-สกุล/ความเกี่ยวข้อง)</label>
                    <input type="text" name="emergencyName" id="emergencyName" class="form-control" placeholder="เช่น ยายมา (ยาย)">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold text-danger">เบอร์โทรฉุกเฉิน</label>
                    <input type="text" name="emergencyTel" id="emergencyTel" class="form-control">
                </div>
            </div>

            <!-- ปุ่มดำเนินการ -->
            <div class="d-flex justify-content-between mt-4">
                <button type="button" id="btnDelete" class="btn btn-danger d-none"><i class="fas fa-trash"></i> ลบข้อมูลนักเรียน</button>
                <button type="submit" id="btnSubmit" class="btn btn-primary px-5 fw-bold"><i class="fas fa-save"></i> บันทึกข้อมูล</button>
            </div>
        </form>
    </div>
</div>

<script>
    // ⚠️ นำ Web App URL ของคุณมาใส่ตรงนี้ ⚠️
    const scriptURL = 'https://script.google.com/macros/s/AKfycbypUi0mbHAcLtoSOCOx_oVNnzyRX7N1vBnpPu3yGpVTUxgRNuV0u1YXzfvWHzywGgYgyg/exec'; 

    // ตัวแปรสำหรับข้อมูลที่อยู่ประเทศไทย
    const THAI_DATA_URL = 'https://raw.githubusercontent.com/kongvut/thai-province-data/master/api_province_with_amphoe_tambon.json';
    let locationData = [];

    // ตรวจสอบ URL Parameter ว่าเป็นการเพิ่มหรือแก้ไข
    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('id');

    // โหลดข้อมูลตอนเปิดหน้า
    document.addEventListener("DOMContentLoaded", async () => {
        await loadThaiData(); // โหลดจังหวัดให้เสร็จก่อน

        if (editId) {
            // โหมดแก้ไข
            document.getElementById('pageTitle').innerHTML = '<i class="fas fa-user-edit text-warning"></i> แก้ไขข้อมูลนักเรียน';
            document.getElementById('actionType').value = 'updateStudent';
            document.getElementById('studentId').value = editId;
            document.getElementById('studentId').readOnly = true; // ห้ามแก้รหัส
            document.getElementById('btnDelete').classList.remove('d-none'); // โชว์ปุ่มลบ
            
            fetchStudentData(editId);
        } else {
            // โหมดเพิ่มใหม่ ตั้งค่าเริ่มต้นเป็น "สระบุรี"
            document.getElementById('province').value = "สระบุรี";
            updateAmphoe();
        }
    });

    // ================= ระบบจัดการที่อยู่ =================
    async function loadThaiData() {
        const response = await fetch(THAI_DATA_URL);
        locationData = await response.json();
        
        const provSelect = document.getElementById('province');
        provSelect.innerHTML = '<option value="">เลือกจังหวัด</option>';
        locationData.forEach(p => {
            provSelect.innerHTML += `<option value="${p.name_th}">${p.name_th}</option>`;
        });
    }

    document.getElementById('province').addEventListener('change', updateAmphoe);
    document.getElementById('amphoe').addEventListener('change', updateTambon);

    function updateAmphoe(defaultAmphoe = '') {
        const provName = document.getElementById('province').value;
        const ampSelect = document.getElementById('amphoe');
        ampSelect.innerHTML = '<option value="">เลือกอำเภอ</option>';
        document.getElementById('tambon').innerHTML = '<option value="">เลือกตำบล</option>';
        
        if (provName) {
            ampSelect.disabled = false;
            const provData = locationData.find(p => p.name_th === provName);
            provData.amphoe.forEach(a => {
                ampSelect.innerHTML += `<option value="${a.name_th}">${a.name_th}</option>`;
            });
            if (defaultAmphoe) ampSelect.value = defaultAmphoe;
        } else {
            ampSelect.disabled = true;
            document.getElementById('tambon').disabled = true;
        }
    }

    function updateTambon(defaultTambon = '') {
        const provName = document.getElementById('province').value;
        const ampName = document.getElementById('amphoe').value;
        const tamSelect = document.getElementById('tambon');
        tamSelect.innerHTML = '<option value="">เลือกตำบล</option>';
        
        if (ampName) {
            tamSelect.disabled = false;
            const provData = locationData.find(p => p.name_th === provName);
            const ampData = provData.amphoe.find(a => a.name_th === ampName);
            ampData.tambon.forEach(t => {
                tamSelect.innerHTML += `<option value="${t.name_th}">${t.name_th}</option>`;
            });
            if (defaultTambon) tamSelect.value = defaultTambon;
        } else {
            tamSelect.disabled = true;
        }
    }

    // ================= ระบบดึงข้อมูลเพื่อแก้ไข =================
    function fetchStudentData(id) {
        document.getElementById('btnSubmit').innerHTML = 'กำลังโหลดข้อมูล...';
        document.getElementById('btnSubmit').disabled = true;

        fetch(`${scriptURL}?action=searchStudent&id=${id}`)
            .then(res => res.json())
            .then(data => {
                if (data.status === 'found') {
                    const s = data.result;
                    // เติมข้อมูลลงช่อง (ชื่อคอลัมน์จาก Sheet ต้องตรงกับ Header)
                    document.getElementById('classLevel').value = s.ClassLevel || '';
                    document.getElementById('room').value = s.Room || '';
                    document.getElementById('fullName').value = s.FullName || '';
                    document.getElementById('nickName').value = s.NickName || '';
                    document.getElementById('gender').value = s.Gender || 'ชาย';
                    document.getElementById('bloodType').value = s.BloodType || '-';
                    document.getElementById('addressDetail').value = s.AddressDetail || '';
                    document.getElementById('fatherName').value = s.FatherName || '';
                    document.getElementById('fatherTel').value = s.FatherTel || '';
                    document.getElementById('motherName').value = s.MotherName || '';
                    document.getElementById('motherTel').value = s.MotherTel || '';
                    document.getElementById('emergencyName').value = s.EmergencyName || '';
                    document.getElementById('emergencyTel').value = s.EmergencyTel || '';

                    // จัดการแปลงวันที่ให้อยู่ในรูปแบบ YYYY-MM-DD เพื่อใส่ input type="date"
                    if(s.BirthDate) {
                        try {
                            const d = new Date(s.BirthDate);
                            document.getElementById('birthDate').value = d.toISOString().split('T')[0];
                        } catch(e) {}
                    }

                    // จัดการ dropdown ที่อยู่
                    if (s.Province) {
                        document.getElementById('province').value = s.Province;
                        updateAmphoe(s.Amphoe);
                        updateTambon(s.Tambon);
                    }
                } else {
                    alert('ไม่พบข้อมูลนักเรียนนี้ในระบบ');
                    window.location.href = 'dashboard.html';
                }
                document.getElementById('btnSubmit').innerHTML = '<i class="fas fa-save"></i> บันทึกข้อมูล';
                document.getElementById('btnSubmit').disabled = false;
            });
    }

    // ================= ระบบบันทึก (เพิ่ม/แก้ไข) =================
    document.getElementById('studentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังบันทึก...';
        btn.disabled = true;

        // ดึงข้อมูลทั้งหมดจาก Form
        const formData = new FormData(this);
        const dataObj = Object.fromEntries(formData.entries());

        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(dataObj)
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                alert(data.msg);
                window.location.href = 'dashboard.html'; // กลับหน้าแดชบอร์ดหลังเซฟเสร็จ
            } else {
                alert('เกิดข้อผิดพลาด: ' + data.msg);
                btn.innerHTML = '<i class="fas fa-save"></i> บันทึกข้อมูล';
                btn.disabled = false;
            }
        }).catch(err => {
            alert('เชื่อมต่อล้มเหลว');
            btn.innerHTML = '<i class="fas fa-save"></i> บันทึกข้อมูล';
            btn.disabled = false;
        });
    });

    // ================= ระบบลบข้อมูล =================
    document.getElementById('btnDelete').addEventListener('click', function() {
        if(confirm(`คุณต้องการลบข้อมูลของรหัส ${editId} ใช่หรือไม่? \n(การกระทำนี้ไม่สามารถย้อนกลับได้)`)) {
            const btn = this;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังลบ...';
            btn.disabled = true;

            const payload = {
                action: 'deleteStudent',
                studentId: editId
            };

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert(data.msg);
                    window.location.href = 'dashboard.html';
                } else {
                    alert('เกิดข้อผิดพลาด: ' + data.msg);
                    btn.innerHTML = '<i class="fas fa-trash"></i> ลบข้อมูลนักเรียน';
                    btn.disabled = false;
                }
            });
        }
    });
</script>
</body>
</html>
