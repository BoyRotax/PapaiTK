<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข่าวสารและกิจกรรม - ศพด. ทับกวาง (ป่าไผ่)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; color: #1e293b !important; }
        .hero-section {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            padding: 50px 20px; color: white; border-radius: 0 0 30px 30px;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2); text-align: center;
        }
        .card-news { border: none; border-radius: 20px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: transform 0.3s; cursor: pointer; text-decoration: none; color: inherit; display: block;}
        .card-news:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); color: inherit;}
        .news-img { width: 100%; height: 200px; object-fit: cover; }
        .news-date { font-size: 13px; color: #3b82f6; font-weight: 600; margin-bottom: 10px; }
        
        /* สไตล์สำหรับหน้าอ่านข่าวเต็ม */
        .article-img { width: 100%; max-height: 450px; object-fit: cover; border-radius: 20px; margin-bottom: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .article-content { font-size: 17px; line-height: 1.8; color: #334155; white-space: pre-wrap; }
        .search-box { border-radius: 50px; padding: 15px 25px; border: 1px solid #cbd5e1; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fas fa-school text-primary fa-2x me-2"></i>
                <div>
                    <div style="font-size: 18px; line-height: 1.2;">ศพด. ทับกวาง (ป่าไผ่)</div>
                    <div style="font-size: 12px; color: #64748b; font-weight: 400;">เทศบาลเมืองทับกวาง จ.สระบุรี</div>
                </div>
            </a>
            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-primary rounded-pill px-4 fw-bold"><i class="fas fa-home me-1"></i> กลับหน้าหลัก</a>
            </div>
        </div>
    </nav>

    <div class="hero-section mb-5">
        <div class="container">
            <h2 class="fw-bold"><i class="far fa-newspaper me-2"></i> ศูนย์รวมข่าวสารและกิจกรรม</h2>
            <p class="mb-0 opacity-75">ติดตามความเคลื่อนไหว กิจกรรม และประกาศสำคัญจากทางศูนย์พัฒนาเด็กเล็ก</p>
        </div>
    </div>

    <div class="container pb-5">
        
        <div id="listView">
            <div class="row justify-content-center mb-5">
                <div class="col-md-8">
                    <div class="position-relative">
                        <input type="text" id="searchInput" class="form-control form-control-lg search-box" placeholder="🔍 ค้นหาข่าวสาร, คำที่เกี่ยวข้อง หรือ ปี (เช่น 2569)...">
                    </div>
                </div>
            </div>
            <div class="row g-4" id="newsContainer">
                <div class="col-12 text-center text-primary py-5">
                    <i class="fas fa-spinner fa-spin fa-2x mb-3"></i><br>กำลังดึงข้อมูลข่าวสารทั้งหมด...
                </div>
            </div>
        </div>

        <div id="articleView" class="d-none">
            <div class="row justify-content-center">
                <div class="col-md-10">
                    <button class="btn btn-light rounded-pill mb-4 border shadow-sm fw-bold text-secondary" onclick="goBackToSearch()">
                        <i class="fas fa-arrow-left me-1"></i> ย้อนกลับไปหน้ารวมข่าว
                    </button>
                    
                    <div class="bg-white p-4 p-md-5 rounded-4 shadow-sm border">
                        <div id="articleDate" class="text-primary fw-bold mb-3"><i class="far fa-calendar-alt me-1"></i> -</div>
                        <h2 id="articleTitle" class="fw-bold mb-4" style="color: #0f172a;">-</h2>
                        <img id="articleImage" src="" class="article-img" alt="ภาพประกอบข่าว">
                        <div id="articleContent" class="article-content">-</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyagDKJpTH0NTnHhMsHUtZmuhNk8AlyeeTBPa90xR9ezHdp9mncc1jf2GrP5b9TjD9dSQ/exec';
        let allNewsData = [];

        // เช็คว่ามี ID ข่าวส่งมาใน URL ไหม (ถ้ามี = เปิดหน้าอ่านข่าวเต็ม)
        document.addEventListener("DOMContentLoaded", function() {
            fetch(scriptURL + '?action=getAllNews')
                .then(res => res.json())
                .then(res => {
                    allNewsData = res.data || [];
                    const urlParams = new URLSearchParams(window.location.search);
                    const newsId = urlParams.get('id');
                    
                    if (newsId) showArticle(newsId);
                    else renderCards(allNewsData);
                })
                .catch(err => {
                    document.getElementById('newsContainer').innerHTML = '<div class="col-12 text-center text-danger py-5">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</div>';
                });
        });

        // ระบบค้นหาข่าวแบบ Real-time
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase();
            const filteredNews = allNewsData.filter(n => {
                const searchString = `${n.Title} ${n.Content} ${n.NewsDate}`.toLowerCase();
                return searchString.includes(keyword);
            });
            renderCards(filteredNews);
        });

        // ฟังก์ชันสร้างการ์ดข่าวสาร
        function renderCards(newsArray) {
            const container = document.getElementById('newsContainer');
            container.innerHTML = '';
            
            if (newsArray.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted py-5"><i class="fas fa-search fa-2x mb-3 opacity-50"></i><br>ไม่พบข่าวสารที่ค้นหา</div>';
                return;
            }

            newsArray.forEach(news => {
                let shortDesc = news.Content.length > 100 ? news.Content.substring(0, 100) + '...' : news.Content;
                let displayDate = formatThaiDate(news.NewsDate);

                const card = `
                <div class="col-md-4">
                    <a href="news.html?id=${news.Timestamp}" class="card card-news h-100">
                        <img src="${news.ImageUrl}" class="news-img" alt="กิจกรรม">
                        <div class="card-body p-4 d-flex flex-column">
                            <div class="news-date"><i class="far fa-calendar-alt me-1"></i> ${displayDate}</div>
                            <h5 class="fw-bold mb-3 text-dark">${news.Title}</h5>
                            <p class="text-muted flex-grow-1" style="font-size: 15px;">${shortDesc}</p>
                            <div class="text-end mt-3"><span class="badge bg-light text-primary border">อ่านเพิ่มเติม <i class="fas fa-arrow-right"></i></span></div>
                        </div>
                    </a>
                </div>
                `;
                container.innerHTML += card;
            });
        }

        // ฟังก์ชันเปิดหน้าอ่านข่าวเต็ม
        function showArticle(newsId) {
            const news = allNewsData.find(n => String(n.Timestamp) === String(newsId));
            if (!news) {
                alert('ไม่พบข่าวสารนี้ หรือข่าวถูกลบไปแล้ว');
                window.location.href = 'news.html';
                return;
            }

            document.getElementById('listView').classList.add('d-none');
            document.getElementById('articleView').classList.remove('d-none');

            document.getElementById('articleDate').innerHTML = `<i class="far fa-calendar-alt me-1"></i> ${formatThaiDate(news.NewsDate)}`;
            document.getElementById('articleTitle').innerText = news.Title;
            document.getElementById('articleImage').src = news.ImageUrl;
            document.getElementById('articleContent').innerText = news.Content; // ใช้ innerText เพื่อให้เว้นบรรทัดทำงาน (white-space: pre-wrap)
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBackToSearch() {
            window.history.pushState({}, document.title, window.location.pathname); // ลบ ?id= ออกจาก URL
            document.getElementById('articleView').classList.add('d-none');
            document.getElementById('listView').classList.remove('d-none');
            renderCards(allNewsData);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ระบบจัดฟอร์แมตวันที่ให้สวยงาม
        function formatThaiDate(dateRaw) {
            let displayDate = dateRaw || '-';
            if (String(displayDate).includes('T')) {
                let parts = String(displayDate).split('T')[0].split('-');
                const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
                let y = parseInt(parts[0]);
                if (y < 2400) y += 543;
                displayDate = `${parseInt(parts[2])} ${thaiMonths[parseInt(parts[1]) - 1]} ${y}`;
            }
            return displayDate;
        }
    </script>
</body>
</html>
