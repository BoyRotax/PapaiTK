<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบข้อมูลนักเรียน - สำหรับผู้ปกครอง</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
        }
        .header-bg { background-color: #3b82f6; color: white; padding: 30px 0; border-radius: 0 0 30px 30px; box-shadow: 0 4px 15px rgba(59,130,246,0.3); }
        .search-box { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-top: -30px; position: relative; z-index: 10;}
        .card-info { border: none; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 20px; overflow: hidden; }
        .student-photo { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; border: 4px solid #3b82f6; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .status-มา { color: #10b981; font-weight: bold; }
        .status-ขาด { color: #ef4444; font-weight: bold; }
        .status-ลา { color: #f59e0b; font-weight: bold; }
        .status-ป่วย { color: #0ea5e9; font-weight: bold; }
        /* 🌟 ทำให้ตารางเลื่อนขึ้นลงได้ */
        .table-scrollable { max-height: 350px; overflow-y: auto; }
        .table-scrollable thead th { position: sticky; top: 0; background-color: #f8f9fa; z-index: 1; }
    </style>
</head>
<body>

    <div class="header-bg text-center">
        <i class="fas fa-school fa-3x mb-2 text-warning"></i>
        <h2 class="fw-bold">ศพด. ทับกวาง (ป่าไผ่)</h2>
        <p class="mb-4">ระบบตรวจสอบข้อมูลนักเรียนออนไลน์</p>
    </div>

    <div class="container" style="max-width: 600px;">
        <div class="search-box text-center">
            <h5 class="fw-bold text-dark mb-3">กรุณากรอกรหัสนักเรียน</h5>
            <div class="input-group input-group-lg mb-3">
                <span class="input-group-text bg-light"><i class="fas fa-id-card text-primary"></i></span>
                <input type="number" id="searchId" class="form-control fw-bold text-center" placeholder="ตัวเลขรหัสนักเรียน..." onkeypress="if(event.key === 'Enter') searchStudentData()">
            </div>
            <button class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow-sm" onclick="searchStudentData()" id="btnSearch">
                <i class="fas fa-search"></i> ตรวจสอบข้อมูล
            </button>
        </div>

        <div id="resultContainer" class="d-none mt-4">
            
            <div class="card card-info p-4 text-center">
                <img id="resPhoto" src="https://via.placeholder.com/150?text=No+Image" class="student-photo mx-auto mb-3" alt="รูปนักเรียน">
                <h4 id="resName" class="fw-bold text-primary mb-1">-</h4>
                <p class="text-muted mb-3">รหัส: <span id="resId" class="fw-bold text-dark">-</span> | อายุ: <span id="resAge" class="fw-bold text-dark">-</span></p>
                
                <div class="d-flex flex-column align-items-center gap-2">
                    <div class="badge bg-light text-dark fs-6 p-2 border w-100 rounded-pill">
                        <i class="fas fa-chalkboard text-warning"></i> <span id="resClass">-</span>
                    </div>
                    <div class="badge bg-light text-primary fs-6 p-2 border w-100 rounded-pill">
                        <i class="fas fa-chalkboard-teacher text-primary"></i> ครูประจำชั้น: <span id="resTeacher">-</span>
                    </div>
                </div>
            </div>

            <div class="card card-info">
                <div class="card-header bg-primary text-white fw-bold py-3 text-center">
                    <i class="fas fa-calendar-check"></i> ประวัติการมาเรียน (30 วันล่าสุด)
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive table-scrollable">
                        <table class="table table-hover mb-0 text-center">
                            <thead class="table-light">
                                <tr>
                                    <th>วันที่</th>
                                    <th>สถานะ</th>
                                    <th>หมายเหตุ</th>
                                </tr>
                            </thead>
                            <tbody id="resAttendance">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card card-info">
                <div class="card-header bg-success text-white fw-bold py-3 text-center">
                    <i class="fas fa-child"></i> พัฒนาการล่าสุด (<span id="resMonth">-</span>)
                </div>
                <div class="card-body row text-center py-4">
                    <div class="col-6 border-end">
                        <h1 id="resWeight" class="text-success fw-bold mb-0">-</h1>
                        <p class="text-muted mb-0 mt-1">น้ำหนัก (กก.)</p>
                    </div>
                    <div class="col-6">
                        <h1 id="resHeight" class="text-info fw-bold mb-0">-</h1>
                        <p class="text-muted mb-0 mt-1">ส่วนสูง (ซม.)</p>
                    </div>
                </div>
            </div>

        </div>
        
        <p class="text-center text-muted mt-5 mb-4" style="font-size: 12px;">© 2026 ระบบสารสนเทศ ศพด.ทับกวาง (ป่าไผ่)</p>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        // ⚠️ นำ Web App URL ของคุณมาใส่ตรงนี้ ⚠️
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyagDKJpTH0NTnHhMsHUtZmuhNk8AlyeeTBPa90xR9ezHdp9mncc1jf2GrP5b9TjD9dSQ/exec'; 

        function searchStudentData() {
            const stuId = document.getElementById('searchId').value.trim();
            if (!stuId) {
                Swal.fire('แจ้งเตือน', 'กรุณากรอกรหัสนักเรียนก่อนครับ', 'warning');
                return;
            }

            const btn = document.getElementById('btnSearch');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังค้นหา...';
            btn.disabled = true;
            document.getElementById('resultContainer').classList.add('d-none');

            fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'action=getParentPortalData&studentId=' + encodeURIComponent(stuId)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    renderData(data);
                    document.getElementById('resultContainer').classList.remove('d-none');
                } else {
                    Swal.fire('ไม่พบข้อมูล', data.message || data.msg, 'error');
                }
            })
            .catch(err => {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
            })
            .finally(() => {
                btn.innerHTML = '<i class="fas fa-search"></i> ตรวจสอบข้อมูล';
                btn.disabled = false;
            });
        }

        function renderData(data) {
            const stu = data.student;
            
            // 1. ข้อมูลส่วนตัว + จัดการเรื่องห้อง
            document.getElementById('resId').innerText = stu.StudentId;
            document.getElementById('resName').innerText = stu.FullName;
            document.getElementById('resAge').innerText = stu.Age;
            document.getElementById('resPhoto').src = stu.PhotoUrl || 'https://via.placeholder.com/150?text=No+Photo';
            
            // จัดการแสดงผลห้องเรียน
            let classDisplay = stu.ClassLevel;
            if (stu.ShowRoom && stu.Room) {
                classDisplay += ` (ห้อง ${stu.Room})`;
            }
            document.getElementById('resClass').innerText = classDisplay;
            
            // แสดงชื่อครูประจำชั้น
            document.getElementById('resTeacher').innerText = stu.Teacher || "ไม่ระบุ";

            // 2. ข้อมูลเช็คชื่อ (ตารางด้านบน)
            const attBody = document.getElementById('resAttendance');
            attBody.innerHTML = '';
            if (data.attendance && data.attendance.length > 0) {
                data.attendance.forEach(att => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="fw-bold">${att.date}</td>
                        <td class="status-${att.status}">${att.status}</td>
                        <td class="text-muted" style="font-size: 14px;">${att.note}</td>
                    `;
                    attBody.appendChild(tr);
                });
            } else {
                attBody.innerHTML = '<tr><td colspan="3" class="text-muted py-4">ยังไม่มีประวัติการเช็คชื่อ</td></tr>';
            }

            // 3. ข้อมูลพัฒนาการ (ด้านล่าง)
            if (data.growth) {
                document.getElementById('resMonth').innerText = data.growth.monthYear;
                document.getElementById('resWeight').innerText = data.growth.weight;
                document.getElementById('resHeight').innerText = data.growth.height;
            } else {
                document.getElementById('resMonth').innerText = "ยังไม่มีข้อมูล";
                document.getElementById('resWeight').innerText = "-";
                document.getElementById('resHeight').innerText = "-";
            }
        }
    </script>
</body>
</html>
