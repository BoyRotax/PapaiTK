<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลบุคลากร - ศพด.ทับกวาง (ป่าไผ่)</title>
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; }
        .sidebar { background: #343a40; color: white; min-height: 100vh; padding-top: 20px; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; font-weight: 600; }
        .sidebar a:hover, .sidebar a.active { color: white; background: #495057; border-left: 4px solid #f39c12; }
        .teacher-card { transition: transform 0.2s; border-radius: 15px; }
        .teacher-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
        .profile-img { width: 120px; height: 120px; object-fit: cover; border: 4px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); background-color: #fff;}
        .modal-header { border-radius: 10px 10px 0 0; }
    </style>
</head>
<body>

<!-- เช็คสถานะ Login -->
<script>
    if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'index.html';
</script>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar d-none d-md-block">
            <div class="text-center mb-4">
                <i class="fas fa-school fa-3x text-warning mb-2"></i>
                <h6 class="text-light">ศพด. ทับกวาง (ป่าไผ่)</h6>
            </div>
            <a href="dashboard.html"><i class="fas fa-chart-pie me-2"></i> แดชบอร์ด</a>
            <a href="regdata.html"><i class="fas fa-user-plus me-2"></i> เพิ่มข้อมูลนักเรียน</a>
            <a href="teachers.html" class="active"><i class="fas fa-chalkboard-teacher me-2"></i> ข้อมูลบุคลากร/ครู</a>
            <hr class="text-secondary">
            <a href="#" onclick="sessionStorage.clear(); window.location.href='index.html';" class="text-danger"><i class="fas fa-sign-out-alt me-2"></i> ออกจากระบบ</a>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold"><i class="fas fa-chalkboard-teacher text-primary"></i> ทำเนียบบุคลากร</h3>
                <button class="btn btn-success fw-bold shadow-sm" onclick="openModal('insert')"><i class="fas fa-plus"></i> เพิ่มบุคลากรใหม่</button>
            </div>

            <!-- แท็บ ปัจจุบัน / อดีต -->
            <ul class="nav nav-pills mb-4 bg-white p-2 rounded shadow-sm w-100" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active fw-bold px-4" id="pills-current-tab" data-bs-toggle="pill" data-bs-target="#pills-current" type="button" role="tab"><i class="fas fa-users"></i> บุคลากรปัจจุบัน</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link fw-bold px-4" id="pills-former-tab" data-bs-toggle="pill" data-bs-target="#pills-former" type="button" role="tab"><i class="fas fa-history"></i> อดีตบุคลากร</button>
                </li>
            </ul>

            <div class="tab-content" id="pills-tabContent">
                <!-- หน้าบุคลากรปัจจุบัน -->
                <div class="tab-pane fade show active" id="pills-current" role="tabpanel">
                    <div id="loading1" class="text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2">กำลังโหลดข้อมูลบุคลากร...</p></div>
                    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-4 g-4" id="currentStaffGrid"></div>
                </div>
                <!-- หน้าอดีตบุคลากร -->
                <div class="tab-pane fade" id="pills-former" role="tabpanel">
                    <div id="loading2" class="text-center py-5 d-none"><div class="spinner-border text-primary"></div><p class="mt-2">กำลังโหลดข้อมูลอดีตบุคลากร...</p></div>
                    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-4 g-4" id="formerStaffGrid"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- ================= Modal สำหรับเพิ่ม/แก้ไข ================= -->
<div class="modal fade" id="teacherModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-lg">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-bold" id="modalTitle"><i class="fas fa-user-edit"></i> จัดการข้อมูลบุคลากร</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form id="teacherForm">
        <div class="modal-body p-4">
            <input type="hidden" id="actionType" name="action" value="insertTeacher">
            
            <!-- 🌟 ส่วนอัปโหลดรูปภาพ 🌟 -->
            <div class="row mb-4 bg-light p-3 rounded border">
                <div class="col-md-4">
                    <label class="form-label fw-bold">รหัสพนักงาน <span class="text-danger">*</span></label>
                    <input type="text" id="empId" name="empId" class="form-control" required placeholder="เช่น T001">
                </div>
                <div class="col-md-8 d-flex align-items-center">
                    <img id="previewTeacherImg" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" style="width:80px; height:80px; object-fit:cover; border-radius:10px; margin-right:15px; border:2px solid #ddd; background-color: white;">
                    <div class="w-100">
                        <label class="form-label fw-bold">เลือกรูปโปรไฟล์</label>
                        <input type="file" id="teacherImageFile" class="form-control form-control-sm" accept="image/*">
                        <!-- ฟิลด์ซ่อนเก็บ URL และ Base64 -->
                        <input type="hidden" id="photoUrl" name="photoUrl">
                        <input type="hidden" id="base64Image" name="base64Image">
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-3">
                    <label class="form-label fw-bold">คำนำหน้า</label>
                    <select id="title" name="title" class="form-select">
                        <option value="นาย">นาย</option><option value="นาง">นาง</option><option value="นางสาว">นางสาว</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label fw-bold">ชื่อ - นามสกุล <span class="text-danger">*</span></label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">ตำแหน่ง</label>
                    <input type="text" id="position" name="position" class="form-control" placeholder="เช่น ครูประจำชั้น">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">ประจำชั้น</label>
                    <select id="assignedClass" name="assignedClass" class="form-select">
                        <option value="-">ไม่มี / ไม่ระบุ</option><option value="เตรียมอนุบาล">เตรียมอนุบาล</option>
                        <option value="อนุบาล 1">อนุบาล 1</option><option value="อนุบาล 2">อนุบาล 2</option><option value="อนุบาล 3">อนุบาล 3</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">ห้อง</label>
                    <input type="number" id="assignedRoom" name="assignedRoom" class="form-control" placeholder="เช่น 1">
                </div>
                <div class="col-md-5">
                    <label class="form-label fw-bold">เบอร์โทรศัพท์</label>
                    <input type="text" id="tel" name="tel" class="form-control">
                </div>
            </div>

            <div class="row mb-2">
                <div class="col-md-6">
                    <label class="form-label fw-bold">วัน/เดือน/ปี ที่เริ่มงาน</label>
                    <input type="date" id="startDate" name="startDate" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold text-primary">สถานะการทำงาน</label>
                    <select id="status" name="status" class="form-select border-primary bg-light fw-bold text-primary">
                        <option value="ปัจจุบัน">ปัจจุบัน</option>
                        <option value="อดีตบุคลากร">อดีตบุคลากร (ลาออก/ย้าย)</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="modal-footer bg-light d-flex justify-content-between border-top-0">
            <button type="button" id="btnDelete" class="btn btn-danger d-none"><i class="fas fa-trash"></i> ลบข้อมูลพนักงาน</button>
            <div>
                <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">ยกเลิก</button>
                <button type="submit" id="btnSubmit" class="btn btn-primary px-4 fw-bold shadow-sm"><i class="fas fa-save"></i> บันทึกข้อมูล</button>
            </div>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ================= Scripts ================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ⚠️ สำคัญ: นำ Web App URL ของคุณ (อันล่าสุด) มาใส่ตรงนี้ ⚠️
    const scriptURL = 'https://script.google.com/macros/s/AKfycbw25RMozalYjgaz_b-EYqihg6uDg4Dafu0-6GUdvU4TWWCbd1G0FmF_qWYI21aFUinZcg/exec'; 

    const teacherModal = new bootstrap.Modal(document.getElementById('teacherModal'));
    let allTeachers = []; 

    // โหลดข้อมูลเมื่อเปิดหน้าเว็บ
    document.addEventListener("DOMContentLoaded", () => {
        loadTeachers();
    });

    // 🌟 ระบบพรีวิวรูปภาพและแปลงเป็น Base64
    document.getElementById('teacherImageFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('previewTeacherImg').src = event.target.result; // แสดงพรีวิว
                document.getElementById('base64Image').value = event.target.result;    // เก็บโค้ดส่งไป Apps Script
            };
            reader.readAsDataURL(file);
        }
    });

    // ================= ระบบคำนวณอายุงาน และ วันที่ =================
    function getTenure(startDate) {
        if (!startDate) return "-";
        const start = new Date(startDate);
        if (isNaN(start)) return "-";
        const now = new Date();
        let years = now.getFullYear() - start.getFullYear();
        let months = now.getMonth() - start.getMonth();
        if (now.getDate() < start.getDate()) months--;
        if (months < 0) { years--; months += 12; }
        if (years === 0 && months === 0) return "เริ่มงานเดือนนี้";
        
        let str = "";
        if (years > 0) str += `${years} ปี `;
        if (months > 0) str += `${months} เดือน`;
        return str.trim();
    }

    function formatDateTH(isoString) {
        if (!isoString) return "-";
        const d = new Date(isoString);
        if (isNaN(d)) return "-";
        return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    // ================= โหลดข้อมูลครูมาสร้าง Card =================
    function loadTeachers() {
        document.getElementById('loading1').classList.remove('d-none');
        document.getElementById('loading2').classList.remove('d-none');
        document.getElementById('currentStaffGrid').innerHTML = '';
        document.getElementById('formerStaffGrid').innerHTML = '';

        fetch(scriptURL + '?action=getTeachers')
            .then(res => res.json())
            .then(data => {
                allTeachers = data; 
                let currentHTML = '';
                let formerHTML = '';

                data.forEach(t => {
                    const imgUrl = t.PhotoUrl ? t.PhotoUrl : 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
                    const badgeColor = t.Status === 'ปัจจุบัน' ? 'bg-success' : 'bg-secondary';
                    const roomTxt = t.AssignedRoom ? `ห้อง ${t.AssignedRoom}` : '';
                    const classTxt = (t.AssignedClass && t.AssignedClass !== '-') ? `${t.AssignedClass} ${roomTxt}` : 'ไม่มีประจำชั้น';
                    
                    const cardHTML = `
                        <div class="col">
                            <div class="card teacher-card h-100 border-0 text-center pt-4 pb-2 bg-white">
                                <div class="position-relative">
                                    <img src="${imgUrl}" class="profile-img rounded-circle">
                                    <span class="position-absolute top-0 end-0 badge ${badgeColor} me-3 mt-2 shadow-sm">${t.Status || 'ปัจจุบัน'}</span>
                                </div>
                                <div class="card-body px-3 d-flex flex-column">
                                    <h5 class="card-title fw-bold text-dark mb-1">${t.Title || ''}${t.Name || ''}</h5>
                                    <h6 class="text-primary fw-bold mb-3">${t.Position || '-'}</h6>
                                    
                                    <div class="bg-light p-2 rounded mb-3 text-start small border flex-grow-1">
                                        <p class="mb-1"><i class="fas fa-chalkboard-teacher text-secondary me-1"></i> <strong>ชั้น:</strong> <span class="text-dark">${classTxt}</span></p>
                                        <p class="mb-1"><i class="fas fa-phone-alt text-secondary me-1"></i> <strong>โทร:</strong> <span class="text-dark">${t.Tel || '-'}</span></p>
                                        <p class="mb-1"><i class="fas fa-calendar-alt text-secondary me-1"></i> <strong>เริ่มงาน:</strong> <span class="text-dark">${formatDateTH(t.StartDate)}</span></p>
                                        <p class="mb-0"><i class="fas fa-clock text-secondary me-1"></i> <strong>อายุงาน:</strong> <span class="fw-bold text-success">${getTenure(t.StartDate)}</span></p>
                                    </div>
                                    
                                    <button class="btn btn-outline-warning btn-sm w-100 fw-bold mt-auto" onclick="openModal('update', '${t.EmpId}')"><i class="fas fa-edit"></i> แก้ไขข้อมูล</button>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    if (t.Status === 'อดีตบุคลากร') formerHTML += cardHTML;
                    else currentHTML += cardHTML;
                });

                document.getElementById('currentStaffGrid').innerHTML = currentHTML || '<div class="col-12 text-center text-muted mt-4"><i class="fas fa-folder-open fa-2x mb-2"></i><br>ยังไม่มีข้อมูลบุคลากรปัจจุบัน</div>';
                document.getElementById('formerStaffGrid').innerHTML = formerHTML || '<div class="col-12 text-center text-muted mt-4"><i class="fas fa-folder-open fa-2x mb-2"></i><br>ไม่มีข้อมูลอดีตบุคลากร</div>';
                
                document.getElementById('loading1').classList.add('d-none');
                document.getElementById('loading2').classList.add('d-none');
            })
            .catch(err => {
                console.error(err);
                alert("โหลดข้อมูลล้มเหลว ตรวจสอบ Web App URL ของคุณครับ");
            });
    }

    // ================= เปิด Modal (เพิ่ม / แก้ไข) =================
    function openModal(mode, empId = null) {
        document.getElementById('teacherForm').reset();
        document.getElementById('previewTeacherImg').src = 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'; // คืนค่ารูปลงค่าเริ่มต้น
        document.getElementById('base64Image').value = ''; // เคลียร์รูปภาพใหม่ที่อาจค้างอยู่
        
        if (mode === 'insert') {
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-user-plus"></i> เพิ่มบุคลากรใหม่';
            document.getElementById('actionType').value = 'insertTeacher';
            document.getElementById('empId').readOnly = false;
            document.getElementById('btnDelete').classList.add('d-none');
        } else {
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-user-edit"></i> แก้ไขข้อมูลบุคลากร';
            document.getElementById('actionType').value = 'updateTeacher';
            document.getElementById('empId').readOnly = true;
            document.getElementById('btnDelete').classList.remove('d-none');
            
            const t = allTeachers.find(x => x.EmpId == empId);
            if(t) {
                document.getElementById('empId').value = t.EmpId;
                document.getElementById('photoUrl').value = t.PhotoUrl || '';
                document.getElementById('previewTeacherImg').src = t.PhotoUrl || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
                
                document.getElementById('title').value = t.Title || 'นาย';
                document.getElementById('name').value = t.Name || '';
                document.getElementById('position').value = t.Position || '';
                document.getElementById('assignedClass').value = t.AssignedClass || '-';
                document.getElementById('assignedRoom').value = t.AssignedRoom || '';
                document.getElementById('tel').value = t.Tel || '';
                document.getElementById('status').value = t.Status || 'ปัจจุบัน';
                
                if(t.StartDate) {
                    try {
                        const d = new Date(t.StartDate);
                        if(!isNaN(d.getTime())) document.getElementById('startDate').value = d.toISOString().split('T')[0];
                    } catch(e){}
                }
            }
        }
        teacherModal.show();
    }

    // ================= บันทึก / ลบ =================
    document.getElementById('teacherForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        
        // เช็คว่ามีการเลือกรูปใหม่หรือไม่
        const isUploading = document.getElementById('base64Image').value !== '';
        btn.innerHTML = isUploading ? '<span class="spinner-border spinner-border-sm"></span> กำลังอัปโหลดรูปและบันทึก...' : '<span class="spinner-border spinner-border-sm"></span> กำลังบันทึก...';
        btn.disabled = true;

        const dataObj = Object.fromEntries(new FormData(this).entries());

        fetch(scriptURL, { method: 'POST', body: JSON.stringify(dataObj) })
        .then(res => res.json())
        .then(data => {
            alert(data.msg);
            if (data.status === 'success') {
                teacherModal.hide();
                loadTeachers(); // โหลดข้อมูลใหม่มาแสดงทันที
            }
        }).catch(err => {
            alert("บันทึกไม่สำเร็จ ลองตรวจสอบอินเทอร์เน็ตดูนะครับ");
        }).finally(() => {
            btn.innerHTML = '<i class="fas fa-save"></i> บันทึกข้อมูล';
            btn.disabled = false;
        });
    });

    document.getElementById('btnDelete').addEventListener('click', function() {
        const id = document.getElementById('empId').value;
        if(confirm(`ยืนยันการลบรหัสพนักงาน ${id} ใช่หรือไม่? \n(การกระทำนี้ลบแล้วกู้คืนไม่ได้นะครับ)`)) {
            const btn = this;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังลบ...';
            btn.disabled = true;

            fetch(scriptURL, { method: 'POST', body: JSON.stringify({ action: 'deleteTeacher', empId: id }) })
            .then(res => res.json())
            .then(data => {
                alert(data.msg);
                if (data.status === 'success') {
                    teacherModal.hide();
                    loadTeachers();
                }
            }).finally(() => {
                btn.innerHTML = '<i class="fas fa-trash"></i> ลบข้อมูลพนักงาน';
                btn.disabled = false;
            });
        }
    });
</script>
</body>
</html>
